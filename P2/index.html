<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuranFahm.app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="shared/typography.css?v=20261113-book5">
    <link rel="stylesheet" href="css/app.css?v=20261113-book5">
</head>
<body>
    <div class="app-wrapper">
        <h1 id="app-title">QuranFahm.app</h1>
        
        <div class="status-banner" id="status-message">Connecting to Vocabulary Records...</div>

        <!-- Dashboard View Framework Layout -->
        <div id="menu-view" class="hidden">
            <div class="segmented-slider-container">
                <div class="slider-pill" id="active-slider-pill"></div>
                <div class="segment-option active" id="opt-all" data-action="updateSegmentSelection" data-value="all">All Words</div>
                <div class="segment-option" id="opt-last" data-action="updateSegmentSelection" data-value="last">Last 10 Words</div>
                <div class="segment-option" id="opt-custom" data-action="updateSegmentSelection" data-value="custom">Custom Range</div>
            </div>

            <div id="book5-round-picker" class="book5-round-picker hidden" aria-label="Choose a ten word round"><button type="button" data-action="selectBook5Round" data-value="1" class="selected" aria-label="Round 1, words 1 to 10"><strong>1</strong><small>1–10</small></button><button type="button" data-action="selectBook5Round" data-value="2" class="" aria-label="Round 2, words 11 to 20"><strong>2</strong><small>11–20</small></button><button type="button" data-action="selectBook5Round" data-value="3" class="" aria-label="Round 3, words 21 to 30"><strong>3</strong><small>21–30</small></button><button type="button" data-action="selectBook5Round" data-value="4" class="" aria-label="Round 4, words 31 to 40"><strong>4</strong><small>31–40</small></button><button type="button" data-action="selectBook5Round" data-value="5" class="" aria-label="Round 5, words 41 to 50"><strong>5</strong><small>41–50</small></button><button type="button" data-action="selectBook5Round" data-value="6" class="" aria-label="Round 6, words 51 to 60"><strong>6</strong><small>51–60</small></button><button type="button" data-action="selectBook5Round" data-value="7" class="" aria-label="Round 7, words 61 to 70"><strong>7</strong><small>61–70</small></button><button type="button" data-action="selectBook5Round" data-value="8" class="" aria-label="Round 8, words 71 to 80"><strong>8</strong><small>71–80</small></button><button type="button" data-action="selectBook5Round" data-value="9" class="" aria-label="Round 9, words 81 to 90"><strong>9</strong><small>81–90</small></button><button type="button" data-action="selectBook5Round" data-value="10" class="" aria-label="Round 10, words 91 to 100"><strong>10</strong><small>91–100</small></button></div>
            <div class="range-drawer-panel" id="range-drawer-box">
                <div class="range-flex-row">
                    <span>From</span>
                    <input type="number" id="range-input-start" value="1" min="1" data-action="validateLiveCustomBounds" data-event="change">
                    <span>To</span>
                    <input type="number" id="range-input-end" value="10" min="1" data-action="validateLiveCustomBounds" data-event="change">
                </div>
            </div>

            <div class="menu-action-layout">
                <button data-action="triggerSelectedSession" data-value="flashcard">Review Mode</button>
                <button data-action="triggerSelectedSession" data-value="quiz">Quiz Mode</button>
                <button id="spelling-mode-button" class="hidden" data-action="triggerSelectedSession" data-value="spelling">Spelling Mode</button>
            </div>

            <!-- Book Selection Dropdown element positioned under Quiz Mode -->
            <select class="custom-select-menu" id="vocabulary-book-selector">
                <option value="book_a" selected>Book A - Arabic to English</option>
                <option value="book_b">Book B - Lughat Al-Quran (Arabic to Urdu)</option>
                <option value="book_e">Book 5 - English to Arabic</option>
            </select>

<div id="book-level-submenu" class="book-level-submenu hidden"><button type="button" data-action="selectBookLevel" data-value="1" class="selected">Level 1<small>KG - Grade 3</small></button><button type="button" data-action="selectBookLevel" data-value="2" class="">Level 2<small>Grades 4 - 6</small></button><button type="button" data-action="selectBookLevel" data-value="3" class="">Level 3<small>Grades 7 - 8</small></button><button type="button" data-action="selectBookLevel" data-value="4" class="">Level 4<small>Grades 9 - 10</small></button></div>
            <!-- Student quiz-code entry -->
            <div id="quiz-code-group" class="custom-input-field-group">
                <input type="text" class="custom-text-input" id="quiz-code-field" placeholder="I have a quiz code" aria-label="Enter quiz code" autocomplete="off" autocapitalize="characters" spellcheck="false">
                <button id="quiz-code-btn" style="padding: 14px 22px;" type="button" data-action="startQuizWithCode">GO</button>
            </div>
            <div id="quiz-code-error" class="quiz-code-error hidden" role="alert" aria-live="polite"></div>
        </div>


        <!-- Spelling replaces Dictionary Mode in this dated edition. -->
        <div id="dictionary-view" class="hidden">
            <div id="dictionary-toolbar" class="dictionary-sort" role="group" aria-label="Sort dictionary">
                <div class="dictionary-sort-pill" id="dictionary-sort-pill"></div>
                <button type="button" id="dict-sort-number" data-action="setDictionarySort" data-value="number">123</button>
                <button type="button" id="dict-sort-english" data-action="setDictionarySort" data-value="english">English</button>
                <button type="button" id="dict-sort-arabic" class="active" data-action="setDictionarySort" data-value="arabic">Arabic</button>
                <div class="dictionary-search-control">
                    <input id="dictionary-search" class="custom-text-input dictionary-search" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" tabindex="-1" aria-label="Live dictionary search" placeholder="Search…">
                    <button type="button" id="dictionary-search-toggle" class="dictionary-search-toggle" aria-label="Open dictionary search" aria-controls="dictionary-search" aria-expanded="false" aria-pressed="false"><span aria-hidden="true">⌨</span></button>
                </div>
            </div>
            <div class="dictionary-layout">
                <div class="dictionary-list" id="dictionary-list" aria-label="Vocabulary dictionary"></div>
                <div class="dictionary-jump" id="dictionary-jump" aria-label="Quick jump index">
                    <div class="dictionary-jump-track"></div>
                </div>
            </div>
            <div class="dictionary-footer"><span id="dictionary-count" role="status" aria-live="polite">0 words</span><span id="dictionary-sort-caption">Sorted by Arabic Alphabet</span></div>
            <button class="exit-btn" style="width:100%; margin-top:16px;" data-action="exitToHome">🏠 Go to Home</button>
        </div>

        <!-- Flashcard Session Module Display Box Container -->
        <div id="flashcard-view" class="hidden">
            <div class="counter-label-text" id="card-counter"></div>
            <div class="display-card-frame" id="review-card-frame" data-action="handleFlashCardBodyClick">
                <div class="card-eye-toggle-overlay" id="card-eye-toggle" data-action="handleEyeToggleIntercept" title="Show Meaning Permanently">
                    <svg xmlns="http://w3.org" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <line class="eye-slash-path" x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2.5"></line>
                    </svg>
                </div>
                <div class="arabic-text-render" id="card-arabic-field">-</div>
                <div class="meaning-text-render hidden" id="card-meaning-field">-</div>
            </div>
            <div class="navigation-buttons">
                <button id="card-action-btn" data-action="handleCardProgression">Show Meaning</button>
                <button class="exit-btn" data-action="exitToHome">← Exit to Menu</button>
            </div>
        </div>

        <div id="quiz-view" class="hidden">
            <div class="counter-label-text" id="quiz-counter"></div>
            <div class="display-card-frame" style="cursor: default; min-height: 140px; margin-bottom: 15px;">
                <div class="arabic-text-render" id="quiz-arabic-field">-</div>
            </div>
            <div class="quiz-options" id="quiz-options-box"></div>
            <div class="navigation-buttons" style="margin-top: 20px;">
                <button class="exit-btn" data-action="exitToHome">← Exit to Menu</button>
            </div>
        </div>

        <div id="spelling-view" class="hidden" data-book="book_e"><div class="counter-label-text" id="spelling-counter"></div><div class="display-card-frame spelling-prompt-card"><div id="spelling-english-prompt" class="spelling-english-prompt"></div></div><input id="spelling-answer" class="custom-text-input spelling-answer" type="text" lang="ar" dir="rtl" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the Arabic word" placeholder="Type the Arabic word"><div id="spelling-feedback" role="status" aria-live="polite"></div><div class="navigation-buttons"><button id="spelling-check-button" data-action="checkSpellingAnswer">Check</button><button id="spelling-next-button" class="hidden" data-action="advanceSpelling">Next Word</button><button class="exit-btn" data-action="exitToHome">Exit to Menu</button></div></div>

        <!-- Reordered Quiz Summary Screen Layout Panels -->
        <div id="quiz-finished-view" class="hidden">
            <div id="screenshot-target-scorecard">
                <h2 style="margin: 0 0 5px 0; color: #073636; font-size: 24px; font-weight: bold;">Quiz Complete!</h2>
                <p style="margin: 0 0 20px 0; color: #475569; font-size: 15px; font-weight: 500;">QuranFahm.app Scorecard</p>
                <div class="summary-metric-circle">
                    <div class="summary-score-big" id="score-text-value">0/10</div>
                    <div class="summary-percent-small" id="percent-text-value">0%</div>
                </div>
            </div>
            
            <button class="exit-btn" id="toggle-table-btn" style="width:100%; margin-bottom: 15px;" data-action="toggleSummaryTableVisibility">📊 Show Performance Summary</button>
            <div id="summary-table-container" class="hidden" style="margin-bottom: 25px; overflow-x: auto;"></div>

            <div class="navigation-buttons">
                <button data-action="copyScreenshotToClipboard">📋 Copy Screenshot to Clipboard</button>
                <button class="exit-btn" data-action="exitToHome">🏠 Go to Home</button>
            </div>
        </div>

        <div id="review-finished-view" class="hidden">
            <div class="display-card-frame" style="cursor: default;">
                <h2 style="margin-top:0; color: #0c4d4d; font-weight: bold;">Session Finished!</h2>
                <p style="margin: 0; color: #334155; font-size: 16px; font-weight: 500;">Excellent job completing your vocabulary review.</p>
            </div>
            <div class="navigation-buttons">
                <button class="exit-btn" data-action="exitToHome">🏠 Go to Home</button>
            </div>
        </div>
    </div>

    <div class="toast-popup" id="toast-alert">Notification Popup</div>
    <script type="module" src="js/app.js?v=20261113-book5"></script>
</body>
</html>
