<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Arabic Quiz</title>
    <!-- Library required to screenshot only the targeted scorecard component -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary-teal: #0c4d4d;
            --button-gold: #d49a3b;
            --button-gold-hover: #e5ab4f;
            --button-gold-active: #b5802e;
            --exit-btn-color: rgba(255, 255, 255, 0.12);
            --exit-btn-hover: rgba(255, 255, 255, 0.2);
            --counter-teal: #a2cbcb;
            --white: #ffffff;
            --gold-glow: 0 0 15px rgba(212, 154, 59, 0.6);
            --disabled-gray: rgba(255, 255, 255, 0.15);
            --disabled-text: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #073636 0%, #0d5454 50%, #083c3c 100%);
            color: var(--white);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-wrapper {
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--button-gold);
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .status-banner {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            color: #b3dfdf;
            margin-bottom: 30px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            font-weight: 500;
        }

        .menu-action-layout, .quiz-options, .navigation-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 25px;
        }

        /* 3-Way Expandable Segmented Control architecture */
        .segmented-slider-container {
            display: flex;
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px;
            border-radius: 12px;
            margin: 25px auto 15px auto;
            max-width: 480px;
            user-select: none;
        }

        .segment-option {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-size: 14px;
            font-weight: bold;
            color: var(--counter-teal);
            cursor: pointer;
            z-index: 2;
            transition: color 0.25s ease;
        }

        .segment-option.active {
            color: #1a1002;
        }

        .slider-pill {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(33.333% - 4px);
            height: calc(100% - 8px);
            background: var(--button-gold);
            border-radius: 9px;
            z-index: 1;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Expandable Range Drawer Box Style */
        .range-drawer-panel {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid transparent;
            padding: 0 15px;
            max-width: 480px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .range-drawer-panel.open {
            max-height: 120px;
            opacity: 1;
            margin-top: 15px;
            border-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
        }

        .range-flex-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: bold;
            color: var(--counter-teal);
        }

        .range-flex-row input {
            width: 75px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px;
            color: #ffffff;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            outline: none;
        }

        .range-flex-row input:focus {
            border-color: var(--button-gold);
        }

        /* Future-Proof Input Custom Field Group */
        .custom-input-field-group {
            display: flex;
            gap: 10px;
            max-width: 480px;
            margin: 20px auto 0 auto;
            width: 100%;
        }

        .custom-text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 14px 16px;
            color: var(--white);
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .custom-text-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .custom-text-input:disabled {
            background: var(--disabled-gray);
            color: var(--disabled-text);
            cursor: not-allowed;
            border-color: transparent;
        }

        /* Dropdown custom selectors rules */
        .custom-select-menu {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 14px;
            color: var(--white);
            font-size: 15px;
            font-weight: 600;
            outline: none;
            margin: 20px auto 5px auto;
            cursor: pointer;
            box-sizing: border-box;
        }

        .custom-select-menu option {
            background: #073636;
            color: var(--white);
        }

        .custom-select-menu option:disabled {
            color: rgba(255, 255, 255, 0.25);
            background: #052626;
        }

        button {
            background-color: var(--button-gold);
            color: #1a1002;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        button:hover:not(:disabled) {
            background-color: var(--button-gold-hover);
            transform: translateY(-3px);
            box-shadow: var(--gold-glow), 0 6px 15px rgba(0,0,0,0.3);
        }

        button:active:not(:disabled) {
            background-color: var(--button-gold-active);
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: var(--disabled-gray);
            color: var(--disabled-text);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        button.exit-btn {
            background-color: var(--exit-btn-color);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 500;
        }

        button.exit-btn:hover {
            background-color: var(--exit-btn-hover);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }
        .display-card-frame {
            background: #ffffff;
            border-radius: 12px;
            padding: 35px 25px;
            margin: 25px 0;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1e2d2d;
            border: 3px solid var(--button-gold);
            box-shadow: var(--gold-glow), 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            position: relative;
        }

        /* Persistent Positioning vector rules for Eye overlay */
        .card-eye-toggle-overlay {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            transition: color 0.2s, transform 0.1s;
            z-index: 10;
        }

        .card-eye-toggle-overlay:hover {
            color: #0c4d4d;
            transform: scale(1.1);
        }

        .card-eye-toggle-overlay.visible-state {
            color: var(--button-gold);
        }

        .counter-label-text {
            font-size: 13px;
            color: var(--counter-teal);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .arabic-text-render {
            font-size: 64px;
            font-family: 'Traditional Arabic', 'Amiri', Georgia, serif;
            font-weight: bold;
            margin: 15px 0;
            color: #0c4d4d;
        }

        .meaning-text-render {
            font-size: 28px;
            font-weight: 600;
            color: #2c3e50;
            margin-top: 10px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 20px;
            width: 100%;
        }

        .quiz-options button {
            background-color: #ffffff;
            color: #1e2d2d;
            text-align: center;
            border: 2px solid #cbd5e1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .quiz-options button:hover {
            background-color: #ffffff;
            border-color: var(--button-gold);
            transform: translateY(-3px);
            box-shadow: var(--gold-glow), 0 6px 15px rgba(0,0,0,0.15);
        }

        .quiz-options button.correct-choice {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #10b981 !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4) !important;
        }

        .quiz-options button.wrong-choice {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4) !important;
        }

        #screenshot-target-scorecard {
            background: #ffffff;
            color: #073636;
            padding: 35px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 3px solid var(--button-gold);
            box-shadow: var(--gold-glow), 0 10px 25px rgba(0,0,0,0.2);
        }

        .summary-metric-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #0d5454;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            border: 4px solid var(--button-gold);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .summary-score-big {
            font-size: 34px;
            font-weight: bold;
        }

        .summary-percent-small {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 1px;
            font-weight: 600;
        }

        /* Redefined dynamic table styling constraints for analytics re-sorting */
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #ffffff;
            color: #1e2d2d;
            border-radius: 10px;
            overflow: hidden;
            font-size: 14px;
            border: 1px solid #e2e8f0;
        }

        .summary-table th, .summary-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }

        .summary-table th {
            background-color: #f1f5f9;
            color: #0f172a;
            font-weight: bold;
        }

        /* Large bold text profiles for target columns */
        .large-bold-cell {
            font-size: 22px;
            font-weight: bold;
        }
        
        .large-arabic-cell {
            font-family: 'Traditional Arabic', 'Amiri', serif;
            color: #0d5454;
        }

        /* Reduced subtle size constraints for student selection output entries */
        .small-choice-cell {
            font-size: 13px;
            color: #475569;
        }

        .badge-icon-pass { font-size: 18px; color: #10b981; }
        .badge-icon-fail { font-size: 18px; color: #ef4444; }

        .hidden { display: none !important; }
        
        .toast-popup {
            position: fixed;
            bottom: 30px;
            background: var(--button-gold);
            color: #1a1002;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 2500;
            box-shadow: var(--gold-glow), 0 4px 15px rgba(0,0,0,0.3);
        }
        .toast-popup.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <h1 id="app-title">Quran Arabic Quiz</h1>
        
        <!-- Status Banner Panel -->
        <div class="status-banner" id="status-message">Connecting to Vocabulary Records...</div>

        <!-- Modified App Hub Dashboard Interface Screen -->
        <div id="menu-view" class="hidden">
            <!-- 3-Way Selector Controls Grid -->
            <div class="segmented-slider-container">
                <div class="slider-pill" id="active-slider-pill"></div>
                <div class="segment-option active" id="opt-all" onclick="updateSegmentSelection('all')">All Words</div>
                <div class="segment-option" id="opt-last" onclick="updateSegmentSelection('last')">Last 10 Words</div>
                <div class="segment-option" id="opt-custom" onclick="updateSegmentSelection('custom')">Custom Range</div>
            </div>

            <!-- Expandable Range Entry Form Box Drawer -->
            <div class="range-drawer-panel" id="range-drawer-box">
                <div class="range-flex-row">
                    <span>From</span>
                    <input type="number" id="range-input-start" value="1" min="1" onchange="validateLiveCustomBounds()">
                    <span>To</span>
                    <input type="number" id="range-input-end" value="10" min="1" onchange="validateLiveCustomBounds()">
                </div>
            </div>

            <!-- Future-Proof Locked Quiz Code Entry Component -->
            <div class="custom-input-field-group">
                <input type="text" class="custom-text-input" id="quiz-code-field" placeholder="I have a quiz code" disabled>
                <button id="quiz-code-btn" style="padding: 14px 22px;" disabled>GO</button>
            </div>

            <!-- Dropdown Resource Selector menu component -->
            <select class="custom-select-menu" id="vocabulary-book-selector">
                <option value="book_a" selected>Book A - Arabic to English</option>
                <option value="book_b" disabled>Book B - Arabic to Urdu (Disabled)</option>
                <option value="book_c" disabled>Book C - Tajweed (Disabled)</option>
            </select>

            <div class="menu-action-layout">
                <button onclick="triggerSelectedSession('flashcard')">Review Mode</button>
                <button onclick="triggerSelectedSession('quiz')">Quiz Mode</button>
            </div>
        </div>
        <!-- Flashcard View Panel with persistent inline vector eye toggler object components -->
        <div id="flashcard-view" class="hidden">
            <div class="counter-label-text" id="card-counter"></div>
            <div class="display-card-frame" id="review-card-frame" onclick="handleFlashCardBodyClick()">
                <!-- Inline SVG Vector Eye object overlay node tracking instruction set configurations -->
                <div class="card-eye-toggle-overlay" id="card-eye-toggle" onclick="handleEyeToggleIntercept(event)">
                    <svg xmlns="http://w3.org" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                <div class="arabic-text-render" id="card-arabic-field">-</div>
                <div class="meaning-text-render hidden" id="card-meaning-field">-</div>
            </div>
            <div class="navigation-buttons">
                <button id="card-action-btn" onclick="handleCardProgression()">Show Meaning</button>
                <button class="exit-btn" onclick="exitToHome()">← Exit to Menu</button>
            </div>
        </div>

        <!-- Quiz Display View Panel -->
        <div id="quiz-view" class="hidden">
            <div class="counter-label-text" id="quiz-counter"></div>
            <div class="display-card-frame" style="cursor: default; min-height: 140px; margin-bottom: 15px;">
                <div class="arabic-text-render" id="quiz-arabic-field">-</div>
            </div>
            <div class="quiz-options" id="quiz-options-box"></div>
            <div class="navigation-buttons" style="margin-top: 20px;">
                <button class="exit-btn" onclick="exitToHome()">← Exit to Menu</button>
            </div>
        </div>

        <!-- Reordered Analytics Summary Screen according to Instruction #1 -->
        <div id="quiz-finished-view" class="hidden">
            <!-- 1. Heading & Isolated Score Target Card Block for screenshot rendering -->
            <div id="screenshot-target-scorecard">
                <h2 style="margin: 0 0 5px 0; color: #073636; font-size: 24px; font-weight: bold;">Quiz Complete!</h2>
                <p style="margin: 0 0 20px 0; color: #475569; font-size: 15px; font-weight: 500;">Quran Arabic Quiz Scorecard</p>
                <div class="summary-metric-circle">
                    <div class="summary-score-big" id="score-text-value">0/10</div>
                    <div class="summary-percent-small" id="percent-text-value">0%</div>
                </div>
            </div>
            
            <!-- 2. Re-sorted columns list sheet drawer trigger button -->
            <button class="exit-btn" id="toggle-table-btn" style="width:100%; margin-bottom: 15px;" onclick="toggleSummaryTableVisibility()">📊 Show Performance Summary</button>
            <div id="summary-table-container" class="hidden" style="margin-bottom: 25px; overflow-x: auto;"></div>

            <!-- 3. Final Execution Copy Commands and Reset Routines -->
            <div class="navigation-buttons">
                <button onclick="copyScreenshotToClipboard()">📋 Copy Screenshot to Clipboard</button>
                <button class="exit-btn" onclick="exitToHome()">🏠 Go to Home</button>
            </div>
        </div>

        <div id="review-finished-view" class="hidden">
            <div class="display-card-frame" style="cursor: default;">
                <h2 style="margin-top:0; color: #0c4d4d; font-weight: bold;">Session Finished!</h2>
                <p style="margin: 0; color: #334155; font-size: 16px; font-weight: 500;">Excellent job completing your vocabulary review.</p>
            </div>
            <div class="navigation-buttons">
                <button class="exit-btn" onclick="exitToHome()">🏠 Go to Home</button>
            </div>
        </div>
    </div>

    <div class="toast-popup" id="toast-alert">Notification Popup</div>
    <script>
        let vocabularyList = [];
        let currentPool = [];
        let sessionWords = [];
        let currentIndex = 0;
        let isMeaningVisible = false;
        let currentMode = 'flashcard'; 
        let quizHistory = [];
        let activeStrategySetting = 'all'; 
        
        // Persistent tracking property matching eye visibility status across increments
        let globalPersistentEyeToggleStatus = false; 

        window.onload = function() {
            fetch('Vocabulary-File.txt')
                .then(response => {
                    if (!response.ok) throw new Error('Network file access error.');
                    return response.text();
                })
                .then(text => { parseVocabulary(text); })
                .catch(error => {
                    console.error(error);
                    document.getElementById('status-message').textContent = '⚠️ Failed to read Vocabulary-File.txt. Check folder files.';
                });
        };

        function parseVocabulary(text) {
            if (!text) {
                document.getElementById('status-message').textContent = '⚠️ Vocabulary-File.txt is empty.';
                return;
            }

            const lines = text.split('\n');
            vocabularyList = [];
            
            lines.forEach(line => {
                if (!line || !line.trim() || !line.includes('=')) return;
                
                const parts = line.split('=');
                if (parts.length >= 2) {
                    const word = parts[0].trim();
                    const meaning = parts[1].trim();
                    if (word && meaning) {
                        vocabularyList.push({ word: word, meaning: meaning });
                    }
                }
            });

            if (vocabularyList.length === 0) {
                document.getElementById('status-message').textContent = '⚠️ Loaded file, but found no matching "word = meaning" formats.';
            } else {
                document.getElementById('status-message').textContent = '✅ Success: Loaded ' + vocabularyList.length + ' total words';
                
                // Initialize default custom range value configurations based on structural capacity
                document.getElementById('range-input-start').value = 1;
                document.getElementById('range-input-end').value = vocabularyList.length;
                document.getElementById('range-input-end').max = vocabularyList.length;
                
                switchView('menu-view');
            }
        }

        // Moves slider pill and reveals custom numeric input panel
        function updateSegmentSelection(targetStrategy) {
            activeStrategySetting = targetStrategy;
            const pill = document.getElementById('active-slider-pill');
            const optAll = document.getElementById('opt-all');
            const optLast = document.getElementById('opt-last');
            const optCustom = document.getElementById('opt-custom');
            const drawer = document.getElementById('range-drawer-box');
            
            optAll.classList.remove('active');
            optLast.classList.remove('active');
            optCustom.classList.remove('active');
            
            if (targetStrategy === 'all') {
                pill.style.transform = 'translateX(0%)';
                optAll.classList.add('active');
                drawer.classList.remove('open');
            } else if (targetStrategy === 'last') {
                pill.style.transform = 'translateX(100%)';
                optLast.classList.add('active');
                drawer.classList.remove('open');
            } else if (targetStrategy === 'custom') {
                pill.style.transform = 'translateX(200%)';
                optCustom.classList.add('active');
                drawer.classList.add('open');
                validateLiveCustomBounds();
            }
        }

        function validateLiveCustomBounds() {
            let startInp = document.getElementById('range-input-start');
            let endInp = document.getElementById('range-input-end');
            
            let startVal = parseInt(startInp.value) || 1;
            let endVal = parseInt(endInp.value) || vocabularyList.length;
            
            if (startVal < 1) startVal = 1;
            if (startVal > vocabularyList.length) startVal = vocabularyList.length;
            if (endVal > vocabularyList.length) endVal = vocabularyList.length;
            
            startInp.value = startVal;
            endInp.value = endVal;
        }
        function triggerSelectedSession(mode) {
            if (activeStrategySetting === 'custom') {
                let startVal = parseInt(document.getElementById('range-input-start').value);
                let endVal = parseInt(document.getElementById('range-input-end').value);
                
                if (startVal > endVal) {
                    let temp = startVal;
                    startVal = endVal;
                    endVal = temp;
                    document.getElementById('range-input-start').value = startVal;
                    document.getElementById('range-input-end').value = endVal;
                }
                
                let rangeSpan = (endVal - startVal) + 1;
                if (rangeSpan < 10) {
                    launchToastAlert("⚠️ Custom Range selection requires at least 10 words!");
                    return;
                }
            }
            startSession(activeStrategySetting, mode);
        }

        function generateQuizChoices(correctItem) {
            let choices = [correctItem];
            const correctMeaningsLower = getMeaningTokens(correctItem.meaning);

            let validDistractors = vocabularyList.filter(item => {
                if (item.word === correctItem.word) return false;
                
                const itemMeaningsLower = getMeaningTokens(item.meaning);
                if (item.meaning.toLowerCase() === correctItem.meaning.toLowerCase()) return false;
                
                const hasOverlap = itemMeaningsLower.some(token => correctMeaningsLower.includes(token));
                return !hasOverlap;
            });

            if (validDistractors.length < 3) {
                validDistractors = vocabularyList.filter(item => item.word !== correctItem.word);
            }

            shuffleArray(validDistractors);

            for (let i = 0; i < validDistractors.length; i++) {
                if (choices.length >= 4) break;
                if (!choices.some(c => c.meaning.toLowerCase() === validDistractors[i].meaning.toLowerCase())) {
                    choices.push(validDistractors[i]);
                }
            }

            while (choices.length < 4) {
                choices.push({ word: '—', meaning: 'Alternative Choice Option ' + (choices.length + 1) });
            }

            shuffleArray(choices);
            return choices;
        }

        function getMeaningTokens(meaningString) {
            return meaningString.toLowerCase()
                .replace(/[!.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
                .split('/')
                .map(s => s.trim())
                .filter(s => s.length > 0);
        }

        function startSession(strategy, mode) {
            currentMode = mode;
            quizHistory = [];
            
            document.getElementById('status-message').classList.add('hidden');
            
            if (strategy === 'all') {
                currentPool = [...vocabularyList];
                sessionWords = getRandomSubset(currentPool, 10);
            } else if (strategy === 'last') {
                currentPool = vocabularyList.slice(-10);
                sessionWords = [...currentPool];
                shuffleArray(sessionWords);
            } else if (strategy === 'custom') {
                let startIdx = parseInt(document.getElementById('range-input-start').value) - 1;
                let endIdx = parseInt(document.getElementById('range-input-end').value) - 1;
                currentPool = vocabularyList.slice(startIdx, endIdx + 1);
                sessionWords = getRandomSubset(currentPool, 10);
            }

            currentIndex = 0;
            
            if (currentMode === 'flashcard') {
                document.getElementById('app-title').textContent = "Quran Arabic Flashcards";
                switchView('flashcard-view');
                
                // Set toggle color state initially based on student configuration properties
                const eyeNode = document.getElementById('card-eye-toggle');
                if (globalPersistentEyeToggleStatus) {
                    eyeNode.classList.add('visible-state');
                } else {
                    eyeNode.classList.remove('visible-state');
                }
                
                showCard();
            } else {
                document.getElementById('app-title').textContent = "Quran Arabic Quiz";
                switchView('quiz-view');
                showQuizQuestion();
            }
        }

        /* --- Interactive Review Visibility Control Logics --- */
        function showCard() {
            document.getElementById('card-counter').textContent = "Word " + (currentIndex + 1) + " of " + sessionWords.length;
            document.getElementById('card-arabic-field').textContent = sessionWords[currentIndex].word;
            document.getElementById('card-meaning-field').textContent = sessionWords[currentIndex].meaning;
            
            // Respect and apply eye toggle state properties
            if (globalPersistentEyeToggleStatus) {
                isMeaningVisible = true;
                document.getElementById('card-meaning-field').classList.remove('hidden');
                document.getElementById('card-action-btn').textContent = "Next Word";
            } else {
                isMeaningVisible = false;
                document.getElementById('card-meaning-field').classList.add('hidden');
                document.getElementById('card-action-btn').textContent = "Show Meaning";
            }
        }

        function handleEyeToggleIntercept(event) {
            event.stopPropagation(); // Stops main background click trigger events from executing
            
            globalPersistentEyeToggleStatus = !globalPersistentEyeToggleStatus;
            const eyeNode = document.getElementById('card-eye-toggle');
            const meaningField = document.getElementById('card-meaning-field');
            const actBtn = document.getElementById('card-action-btn');
            
            if (globalPersistentEyeToggleStatus) {
                eyeNode.classList.add('visible-state');
                isMeaningVisible = true;
                meaningField.classList.remove('hidden');
                actBtn.textContent = "Next Word";
            } else {
                eyeNode.classList.remove('visible-state');
                isMeaningVisible = false;
                meaningField.classList.add('hidden');
                actBtn.textContent = "Show Meaning";
            }
        }

        function handleFlashCardBodyClick() {
            // Body click action ignores input if eye status forces definition visibility rules
            if (globalPersistentEyeToggleStatus) return;
            
            isMeaningVisible = !isMeaningVisible;
            const meaningField = document.getElementById('card-meaning-field');
            const actBtn = document.getElementById('card-action-btn');
            
            if (isMeaningVisible) {
                meaningField.classList.remove('hidden');
                actBtn.textContent = "Next Word";
            } else {
                meaningField.classList.add('hidden');
                actBtn.textContent = "Show Meaning";
            }
        }

        function handleCardProgression() {
            if (!isMeaningVisible) {
                isMeaningVisible = true;
                document.getElementById('card-meaning-field').classList.remove('hidden');
                document.getElementById('card-action-btn').textContent = "Next Word";
            } else {
                currentIndex++;
                if (currentIndex < sessionWords.length) {
                    showCard();
                } else {
                    switchView('review-finished-view');
                }
            }
        }
        /* --- Quiz Engine Functional Logic --- */
        function showQuizQuestion() {
            const currentItem = sessionWords[currentIndex];
            document.getElementById('quiz-counter').textContent = "Question " + (currentIndex + 1) + " of " + sessionWords.length;
            document.getElementById('quiz-arabic-field').textContent = currentItem.word;

            const optionsBox = document.getElementById('quiz-options-box');
            optionsBox.innerHTML = '';

            const choices = generateQuizChoices(currentItem);
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.textContent = choice.meaning;
                btn.onclick = function() { evaluateQuizAnswer(btn, choice, currentItem); };
                optionsBox.appendChild(btn);
            });
        }

        function evaluateQuizAnswer(selectedButton, chosenChoice, correctItem) {
            const optionsBox = document.getElementById('quiz-options-box');
            const buttons = optionsBox.getElementsByTagName('button');
            
            for (let btn of buttons) {
                btn.disabled = true;
            }

            const isCorrect = (chosenChoice.meaning === correctItem.meaning);
            
            quizHistory.push({
                index: currentIndex + 1,
                word: correctItem.word,
                chosen: chosenChoice.meaning,
                correct: correctItem.meaning,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                selectedButton.classList.add('correct-choice');
            } else {
                selectedButton.classList.add('wrong-choice');
                for (let btn of buttons) {
                    if (btn.textContent === correctItem.meaning) {
                        btn.classList.add('correct-choice');
                    }
                }
            }

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < sessionWords.length) {
                    showQuizQuestion();
                } else {
                    displayQuizSummary();
                }
            }, 1200);
        }

        function displayQuizSummary() {
            const totalCorrect = quizHistory.filter(h => h.isCorrect).length;
            const percentage = Math.round((totalCorrect / sessionWords.length) * 100);
            
            document.getElementById('score-text-value').textContent = totalCorrect + "/" + sessionWords.length;
            document.getElementById('percent-text-value').textContent = percentage + "%";

            const tableContainer = document.getElementById('summary-table-container');
            tableContainer.classList.add('hidden');
            document.getElementById('toggle-table-btn').textContent = "📊 Show Performance Summary";

            // Reordered Sheet Column Mapping per Instruction #1: # | Result | Word | Correct Meaning | Your Choice
            let tableHtml = '<table class="summary-table"><thead><tr>' +
                '<th style="width: 8%;">#</th>' +
                '<th style="width: 15%;">Result</th>' +
                '<th style="width: 25%;">Word</th>' +
                '<th style="width: 27%;">Correct Meaning</th>' +
                '<th style="width: 25%;">Your Choice</th>' +
                '</tr></thead><tbody>';

            quizHistory.forEach(item => {
                // High-visibility checkmark indicator tokens
                const badgeToken = item.isCorrect ? '<span class="badge-icon-pass">✓</span>' : '<span class="badge-icon-fail">✗</span>';
                
                tableHtml += '<tr>' +
                    '<td>' + item.index + '</td>' +
                    '<td>' + badgeToken + '</td>' +
                    '<td class="large-bold-cell large-arabic-cell">' + item.word + '</td>' +
                    '<td class="large-bold-cell" style="color:#0f172a;">' + item.correct + '</td>' +
                    '<td class="small-choice-cell">' + item.chosen + '</td>' +
                    '</tr>';
            });

            tableHtml += '</tbody></table>';
            tableContainer.innerHTML = tableHtml;
            switchView('quiz-finished-view');
        }

        function toggleSummaryTableVisibility() {
            const tableContainer = document.getElementById('summary-table-container');
            const toggleBtn = document.getElementById('toggle-table-btn');
            
            if (tableContainer.classList.contains('hidden')) {
                tableContainer.classList.remove('hidden');
                toggleBtn.textContent = "📊 Hide Performance Summary";
            } else {
                tableContainer.classList.add('hidden');
                toggleBtn.textContent = "📊 Show Performance Summary";
            }
        }

        function copyScreenshotToClipboard() {
            const target = document.getElementById('screenshot-target-scorecard');
            
            html2canvas(target, {
                scale: 2,
                backgroundColor: "#ffffff",
                logging: false,
                useCORS: true
            }).then(canvas => {
                canvas.toBlob(blob => {
                    if (!blob) {
                        launchToastAlert("⚠️ Rendering image profile failed.");
                        return;
                    }
                    
                    try {
                        navigator.clipboard.write([
                            new ClipboardItem({ [blob.type]: blob })
                        ]).then(() => {
                            launchToastAlert("📸 Scorecard copied! Paste (Ctrl+V) it into your chat.");
                        }).catch(err => {
                            console.error(err);
                            fallbackDownloadMechanism(canvas);
                        });
                    } catch (clipboardError) {
                        console.error(clipboardError);
                        fallbackDownloadMechanism(canvas);
                    }
                }, 'image/png');
            });
        }

        function fallbackDownloadMechanism(canvas) {
            const dataUrl = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.download = 'Quiz_Scorecard.png';
            link.href = dataUrl;
            link.click();
            launchToastAlert("📥 Clipboard restricted. Scorecard saved as download!");
        }

        function getRandomSubset(arr, size) {
            let shuffled = [...arr];
            shuffleArray(shuffled);
            return shuffled.slice(0, size);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function switchView(viewId) {
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('flashcard-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('quiz-finished-view').classList.add('hidden');
            document.getElementById('review-finished-view').classList.add('hidden');

            document.getElementById(viewId).classList.remove('hidden');
        }

        function exitToHome() {
            document.getElementById('app-title').textContent = "Quran Arabic Quiz";
            document.getElementById('status-message').classList.remove('hidden');
            switchView('menu-view');
        }

        function launchToastAlert(message) {
            const toast = document.getElementById('toast-alert');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }
    </script>
</body>
</html>
