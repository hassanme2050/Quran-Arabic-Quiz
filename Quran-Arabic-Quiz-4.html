<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Vocabulary Quiz & Flashcards</title>
    <!-- html2canvas library used exclusively for capturing the score summary screen -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #16a085;
            --accent-hover: #1abc9c;
            --wrong-color: #c0392b;
            --bg-color: #ecf0f1;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 28px;
        }

        .status {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
            min-height: 20px;
        }

        .menu-buttons, .quiz-options, .navigation-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-weight: 600;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        button:active {
            transform: scale(0.98);
        }

        button.accent {
            background-color: var(--accent-color);
        }

        button.accent:hover {
            background-color: var(--accent-hover);
        }

        .card-container {
            perspective: 1000px;
            margin: 30px auto;
            width: 100%;
            height: 220px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            border: 2px solid #bdc3c7;
            background: #fafafa;
            box-sizing: border-box;
            padding: 20px;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #fcfcfc;
        }

        .arabic-text {
            font-size: 48px;
            dir: rtl;
            font-family: 'Traditional Arabic', 'Amiri', Georgia, serif;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .meaning-text {
            font-size: 24px;
            color: var(--secondary-color);
            font-weight: 500;
        }

        .counter {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        .quiz-word-display {
            font-size: 54px;
            margin: 30px 0;
            dir: rtl;
            font-family: 'Traditional Arabic', 'Amiri', Georgia, serif;
            font-weight: bold;
        }

        .quiz-options button {
            background-color: #f8f9fa;
            color: var(--text-color);
            border: 2px solid #bdc3c7;
            text-align: left;
            padding-left: 20px;
        }

        .quiz-options button:hover {
            background-color: #e9ecef;
            border-color: #7f8c8d;
        }

        .quiz-options button.correct-choice {
            background-color: var(--accent-color) !important;
            color: white !important;
            border-color: var(--accent-color) !important;
        }

        .quiz-options button.wrong-choice {
            background-color: var(--wrong-color) !important;
            color: white !important;
            border-color: var(--wrong-color) !important;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            text-align: left;
            font-size: 15px;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }

        .summary-table th {
            background-color: #f8f9fa;
            color: var(--primary-color);
        }

        .summary-arabic {
            font-size: 22px;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-weight: bold;
        }

        .text-success { color: var(--accent-color); font-weight: bold; }
        .text-danger { color: var(--wrong-color); font-weight: bold; }

        .hidden { display: none !important; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }

        #screenshot-area {
            padding: 20px;
            background: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h1 id="app-title">Arabic Vocabulary Flashcards</h1>
        <div class="status" id="status-message">Loading vocabulary setup...</div>

        <!-- Mode Selection Menu View -->
        <div id="menu-view" class="hidden">
            <div class="menu-buttons">
                <button onclick="startSession('all', 'flashcard')">Review All (10 Random Words)</button>
                <button onclick="startSession('last', 'flashcard')">Review Last 10 Words</button>
                <button class="accent" onclick="startSession('all', 'quiz')">Quiz Mode: All (10 Random)</button>
                <button class="accent" onclick="startSession('last', 'quiz')">Quiz Mode: Last 10 Words</button>
            </div>
        </div>

        <!-- Flashcard Review View -->
        <div id="flashcard-view" class="hidden">
            <div class="counter" id="card-counter">Word 0 of 0</div>
            <div class="card-container" onclick="flipCard()">
                <div class="flashcard" id="main-card">
                    <div class="card-face card-front">
                        <div class="arabic-text" id="front-arabic">-</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="meaning-text" id="back-meaning">-</div>
                    </div>
                </div>
            </div>
            <div class="navigation-buttons">
                <button class="accent" id="action-btn" onclick="handleCardAction()">Show Meaning</button>
                <button onclick="exitToMenu()">← Exit to Menu</button>
            </div>
        </div>

        <!-- Quiz View -->
        <div id="quiz-view" class="hidden">
            <div class="counter" id="quiz-counter">Question 0 of 10</div>
            <div class="quiz-word-display" id="quiz-arabic-word">-</div>
            <div class="quiz-options" id="quiz-options-container">
                <!-- Options built here dynamically -->
            </div>
            <div class="navigation-buttons" style="margin-top: 25px;">
                <button onclick="exitToMenu()">← Exit to Menu</button>
            </div>
        </div>

        <!-- Quiz Finished View -->
        <div id="quiz-finished-view" class="hidden">
            <div id="screenshot-area">
                <h1 style="margin-bottom: 10px;">Quiz Performance Summary</h1>
                <div class="score-circle" id="final-score-circle">0/10</div>
                <div id="summary-table-container"></div>
            </div>
            
            <div class="navigation-buttons">
                <button class="accent" onclick="copyScreenshot()">📋 Copy Screenshot to Clipboard</button>
                <button onclick="exitToMenu()">🏠 Go to Home</button>
            </div>
        </div>

        <!-- Flashcard Session Finished View -->
        <div id="review-finished-view" class="hidden">
            <h2>Session Finished!</h2>
            <p>Excellent job completing your vocabulary review.</p>
            <div class="navigation-buttons">
    <script>
        let vocabularyList = [];
        let currentPool = [];
        let sessionWords = [];
        let currentIndex = 0;
        let isFlipped = false;
        let currentMode = 'flashcard'; // 'flashcard' or 'quiz'
        let quizHistory = []; 

        window.onload = function() {
            fetch('Vocabulary-File.txt')
                .then(response => {
                    if (!response.ok) throw new Error('Network error loading file.');
                    return response.text();
                })
                .then(text => { parseVocabulary(text); })
                .catch(error => {
                    console.error(error);
                    document.getElementById('status-message').textContent = 'Error parsing local vocabulary records.';
                });
        };

        function parseVocabulary(text) {
            const lines = text.split('\n');
            vocabularyList = [];
            
            lines.forEach(line => {
                if (line.includes('=')) {
                    const parts = line.split('=');
                    const word = parts[0].trim();
                    const meaning = parts[1].trim();
                    if (word && meaning) {
                        vocabularyList.push({ word: word, meaning: meaning });
                    }
                }
            });

            if (vocabularyList.length === 0) {
                document.getElementById('status-message').textContent = 'No valid vocabulary configurations recognized.';
            } else {
                document.getElementById('status-message').classList.add('hidden');
                switchView('menu-view');
            }
        }

        function generateQuizChoices(correctItem) {
            let choices = [correctItem];
            const correctMeaningsLower = getMeaningTokens(correctItem.meaning);

            // Filter the options pool to strictly prevent repetitive definitions
            let validDistractors = vocabularyList.filter(item => {
                if (item.word === correctItem.word) return false;
                
                const itemMeaningsLower = getMeaningTokens(item.meaning);
                
                // Block if exact text matches
                if (item.meaning.toLowerCase() === correctItem.meaning.toLowerCase()) return false;
                
                // Block if any single keyword matches (handles multi-meaning words like "That")
                const hasOverlap = itemMeaningsLower.some(token => correctMeaningsLower.includes(token));
                return !hasOverlap;
            });

            // Back up safety list if filter is too aggressive
            if (validDistractors.length < 3) {
                validDistractors = vocabularyList.filter(item => item.word !== correctItem.word);
            }

            shuffleArray(validDistractors);

            // Extract exactly 3 clean choices
            for (let i = 0; i < validDistractors.length; i++) {
                if (choices.length >= 4) break;
                if (!choices.some(c => c.meaning.toLowerCase() === validDistractors[i].meaning.toLowerCase())) {
                    choices.push(validDistractors[i]);
                }
            }

            while (choices.length < 4) {
                choices.push({ word: '—', meaning: `Alternative Option \${choices.length}` });
            }

            shuffleArray(choices);
            return choices;
        }

        // Extracts core keywords from definitions by stripping exclamation marks and slashes
        function getMeaningTokens(meaningString) {
            return meaningString.toLowerCase()
                .replace(/[!.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
                .split('/')
                .map(s => s.trim())
                .filter(s => s.length > 0);
        }
        function startSession(strategy, mode) {
            currentMode = mode;
            quizHistory = [];
            
            if (strategy === 'all') {
                currentPool = [...vocabularyList];
                sessionWords = getRandomSubset(currentPool, 10);
            } else if (strategy === 'last') {
                currentPool = vocabularyList.slice(-10);
                sessionWords = [...currentPool];
                shuffleArray(sessionWords);
            }

            currentIndex = 0;
            
            if (currentMode === 'flashcard') {
                document.getElementById('app-title').textContent = "Arabic Vocabulary Flashcards";
                switchView('flashcard-view');
                showCard();
            } else {
                document.getElementById('app-title').textContent = "Arabic Vocabulary Quiz";
                switchView('quiz-view');
                showQuizQuestion();
            }
        }

        /* --- Flashcard Mode Logic --- */
        function showCard() {
            isFlipped = false;
            document.getElementById('main-card').classList.remove('flipped');
            document.getElementById('card-counter').textContent = `Word \${currentIndex + 1} of \${sessionWords.length}`;
            document.getElementById('front-arabic').textContent = sessionWords[currentIndex].word;
            document.getElementById('back-meaning').textContent = sessionWords[currentIndex].meaning;
            document.getElementById('action-btn').textContent = "Show Meaning";
        }

        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                document.getElementById('main-card').classList.add('flipped');
                document.getElementById('action-btn').textContent = "Next Word";
            } else {
                document.getElementById('main-card').classList.remove('flipped');
                document.getElementById('action-btn').textContent = "Show Meaning";
            }
        }

        function handleCardAction() {
            if (!isFlipped) {
                flipCard();
            } else {
                currentIndex++;
                if (currentIndex < sessionWords.length) {
                    showCard();
                } else {
                    switchView('review-finished-view');
                }
            }
        }

        /* --- Quiz Mode Logic --- */
        function showQuizQuestion() {
            const currentItem = sessionWords[currentIndex];
            document.getElementById('quiz-counter').textContent = `Question \${currentIndex + 1} of \${sessionWords.length}`;
            document.getElementById('quiz-arabic-word').textContent = currentItem.word;

            const optionsContainer = document.getElementById('quiz-options-container');
            optionsContainer.innerHTML = '';

            const choices = generateQuizChoices(currentItem);
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.textContent = choice.meaning;
                btn.onclick = function() { evaluateQuizAnswer(btn, choice, currentItem); };
                optionsContainer.appendChild(btn);
            });
        }

        function evaluateQuizAnswer(selectedButton, chosenChoice, correctItem) {
            const optionsContainer = document.getElementById('quiz-options-container');
            const buttons = optionsContainer.getElementsByTagName('button');
            
            for (let btn of buttons) {
                btn.disabled = true;
            }

            const isCorrect = (chosenChoice.meaning === correctItem.meaning);
            
            quizHistory.push({
                index: currentIndex + 1,
                word: correctItem.word,
                chosen: chosenChoice.meaning,
                correct: correctItem.meaning,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                selectedButton.classList.add('correct-choice');
            } else {
                selectedButton.classList.add('wrong-choice');
                for (let btn of buttons) {
                    if (btn.textContent === correctItem.meaning) {
                        btn.classList.add('correct-choice');
                    }
                }
            }

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < sessionWords.length) {
                    showQuizQuestion();
                } else {
                    displayQuizSummary();
                }
            }, 1200);
        }

        function displayQuizSummary() {
            const totalCorrect = quizHistory.filter(h => h.isCorrect).length;
            document.getElementById('final-score-circle').textContent = `\${totalCorrect}/\${sessionWords.length}`;

            let tableHtml = `
                <table class="summary-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Word</th>
                            <th>Your Choice</th>
                            <th>Correct Meaning</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            quizHistory.forEach(item => {
                tableHtml += `
                    <tr>
                        <td>\${item.index}</td>
                        <td class="summary-arabic"><b>\${item.word}</b></td>
                        <td>\${item.chosen}</td>
                        <td><b>\${item.correct}</b></td>
                        <td>\${item.isCorrect ? '<span class="text-success">Right</span>' : '<span class="text-danger">Wrong</span>'}</td>
                    </tr>
                `;
            });

            tableHtml += `</tbody></table>`;
            document.getElementById('summary-table-container').innerHTML = tableHtml;
            switchView('quiz-finished-view');
        }

        /* --- Canvas Capturing Pipeline --- */
        function copyScreenshot() {
            const target = document.getElementById('screenshot-area');
            
            html2canvas(target, {
                scale: 2,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                canvas.toBlob(blob => {
                    if (!blob) {
                        showToast("Error processing canvas data.");
                        return;
                    }
                    
                    navigator.clipboard.write([
                        new ClipboardItem({ [blob.type]: blob })
                    ]).then(() => {
                        showToast("Screenshot copied! Paste it into your chat or email.");
                    }).catch(err => {
                        console.error(err);
                        showToast("Clipboard blocked. Use manual screenshot instead.");
                    });
                }, 'image/png');
            });
        }

        /* --- General System Utilities --- */
        function getRandomSubset(arr, size) {
            let shuffled = [...arr];
            shuffleArray(shuffled);
            return shuffled.slice(0, size);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function switchView(viewId) {
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('flashcard-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('quiz-finished-view').classList.add('hidden');
            document.getElementById('review-finished-view').classList.add('hidden');

            document.getElementById(viewId).classList.remove('hidden');
        }

        function exitToMenu() {
            document.getElementById('app-title').textContent = "Arabic Vocabulary Flashcards";
            switchView('menu-view');
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
