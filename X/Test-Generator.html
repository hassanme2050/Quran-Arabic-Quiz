<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Arabic Quiz - Test Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&display=swap');

:root {
    --arabic-font: 'Alexandria', 'Segoe UI', Arial, sans-serif;
}

/* Shared by student screens and both teacher tools. */
.arabic-text-render,
.large-arabic-cell,
.dictionary-word,
.tile-arabic-text,
.large-arabic-input {
    font-family: var(--arabic-font);
    font-weight: 600;
    letter-spacing: normal;
}

.dictionary-jump[data-script="arabic"] button {
    font-family: var(--arabic-font);
    font-weight: 600;
}

</style>
    <style>
:root {
    --primary-gray: #2d3748;
    --button-gold: #d49a3b;
    --button-gold-hover: #e5ab4f;
    --button-gold-active: #b5802e;
    --exit-btn-color: rgba(255, 255, 255, 0.12);
    --exit-btn-hover: rgba(255, 255, 255, 0.2);
    --counter-gray: #a0aec0;
    --white: #ffffff;
    --gold-glow: 0 0 15px rgba(212, 154, 59, 0.6);
    --disabled-gray: rgba(255, 255, 255, 0.1);
    --disabled-text: rgba(255, 255, 255, 0.25);
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a202c 100%);
    color: var(--white);
    margin: 0;
    padding: clamp(8px, 1.5vh, 16px);
    height: 100vh;
    height: 100dvh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
}

.generator-wrapper {
    width: 100%;
    max-width: 1400px;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    text-align: center;
    gap: 8px;
}

h1 {
    color: var(--button-gold);
    margin-top: 0;
    margin-bottom: 0;
    font-size: clamp(20px, 3.6vh, 28px);
    font-weight: bold;
    letter-spacing: 0.5px;
}

.status-banner {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 13px;
    color: #cbd5e0;
    margin-bottom: 0;
    display: inline-block;
    width: 100%;
    box-sizing: border-box;
    font-weight: 500;
    transition: opacity 0.5s ease;
}

.words-selection-grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: clamp(4px, 0.7vw, 8px);
    flex: 1 1 0;
    min-height: 0;
    min-width: 0;
    margin-bottom: 0;
    width: 100%;
    box-sizing: border-box;
}

.compact-word-tile {
    background: #ffffff;
    border-radius: 8px;
    padding: clamp(3px, 0.8vh, 8px);
    color: #1a202c;
    border: 2px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: transform 0.2s, border-color 0.2s;
    cursor: pointer;
    user-select: none;
    box-sizing: border-box;
    text-align: center;
    justify-content: space-between;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
}

.compact-word-tile:hover { transform: translateY(-1px); border-color: #cbd5e0; }
.compact-word-tile.selected-state { border-color: var(--button-gold); background: #fdfbf7; }
.tile-header-index { font-size: 10px; font-weight: 800; color: #718096; text-align: left; }
.tile-arabic-text {
    font-size: clamp(16px, 2.8vh, 22px);
    font-family: var(--arabic-font);
    font-weight: 600;
    color: #2d3748;
    margin: 2px 0;
    line-height: 1.65;
    padding: 0.1em 0;
    direction: rtl;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.tile-meaning-text {
    font-size: 11px;
    font-weight: 700;
    color: #4a5568;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-top: 2px;
    border-top: 1px dashed #edf2f7;
}
.tile-checkbox-anchor {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 14px;
    height: 14px;
    border: 2px solid #cbd5e0;
    border-radius: 3px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
}
.compact-word-tile.selected-state .tile-checkbox-anchor { background-color: var(--button-gold); border-color: var(--button-gold); }
.compact-word-tile.selected-state .tile-checkbox-anchor::after {
    content: "✓";
    color: #1a1002;
    font-size: 11px;
    font-weight: bold;
}

.bottom-control-dashboard {
    background: rgba(45, 55, 72, 0.95);
    border: 2px solid var(--button-gold);
    padding: 10px 12px;
    border-radius: 12px;
    box-shadow: var(--gold-glow), 0 -4px 20px rgba(0,0,0,0.3);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
    box-sizing: border-box;
    width: 100%;
    flex: 0 0 auto;
}
.counter-status-text { grid-column:1 / -1; font-size:14px; font-weight:bold; color:var(--white); text-align:left; min-width:0; }
.counter-status-text span { color: var(--button-gold); }
.output-code-container { display:flex; gap:8px; min-width:0; }
.hex-output-field {
    flex: 1;
    min-width: 0;
    width: 0;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    padding: 10px;
    color: var(--button-gold);
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px;
    font-weight: bold;
    outline: none;
    text-align: center;
}
.pagination-bar-wrapper { display: flex; align-items: center; gap: 10px; }
.page-indicator-text { font-size: 13px; font-weight: 600; color: var(--counter-gray); white-space: nowrap; }
button {
    background-color: var(--button-gold);
    color: #1a1002;
    border: none;
    padding: 12px 20px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.2s, transform 0.1s;
    white-space: nowrap;
}
button:hover:not(:disabled) { background-color: var(--button-gold-hover); }
button:disabled { background-color: var(--disabled-gray); color: var(--disabled-text); cursor: not-allowed; }
.toast-popup {
    position: fixed;
    bottom: 100px;
    background: var(--button-gold);
    color: #1a1002;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 2500;
}
.toast-popup.show { opacity: 1; }

/* Teacher verification uses the same dark-gray and gold palette as the generator. */
.auth-gate-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a202c 100%);
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    transition: opacity 0.3s ease;
    overflow-y: auto;
}
.auth-card {
    background: rgba(45, 55, 72, 0.98);
    border: 2px solid var(--button-gold);
    border-radius: 12px;
    padding: 34px 28px;
    max-width: 440px;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    box-shadow: var(--gold-glow), 0 10px 25px rgba(0,0,0,0.3);
    color: var(--white);
}
.auth-card h2 { margin: 0 0 10px; font-size: 22px; color: var(--button-gold); }
.auth-card p { color: #cbd5e0; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
.password-input-wrapper { display: flex; flex-direction: column; gap: 13px; width: 100%; }
.admin-text-field {
    display: block;
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 13px 14px;
    color: var(--white);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
}
.admin-text-field::placeholder { color: #a0aec0; }
.admin-text-field:focus { border-color: var(--button-gold); }
.custom-select-menu {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--white);
    font-size: 15px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
}
.custom-select-menu:focus { border-color: var(--button-gold); }
.custom-select-menu option { color: #1a202c; background: #ffffff; }
.custom-select-menu option:disabled { color: #718096; background: #e2e8f0; }
#verify-open-btn { display: block; width: 100%; box-sizing: border-box; }
.auth-error { min-height: 18px; color: #feb2b2; font-size: 13px; text-align: left; }
.is-hidden { display: none !important; }
@media (min-width: 701px) and (max-height: 560px) {
    .generator-wrapper { gap:4px; }
    .compact-word-tile { padding:2px 4px; }
    .tile-arabic-text { font-size:17px; margin:0; }
    .tile-meaning-text { font-size:10px; padding-top:1px; }
    .bottom-control-dashboard { padding:6px 8px; gap:4px 8px; }
    button { padding:8px 12px; }
}
@media (max-width: 700px) {
    body { height:auto; min-height:100dvh; overflow:auto; }
    .generator-wrapper { height:auto; }
    .words-selection-grid { flex:none; grid-template-columns:repeat(5,minmax(0,1fr)); grid-template-rows:none; grid-auto-rows:minmax(84px,auto); }
    .bottom-control-dashboard { grid-template-columns:minmax(0,1fr); }
    .counter-status-text { text-align:center; }
    .output-code-container { width:100%; flex-wrap:wrap; }
    .hex-output-field { min-width:100px; }
    .pagination-bar-wrapper { justify-content:center; }
    .output-code-container button { padding:10px; font-size:12px; }
}

</style>
</head>
<body>
    <!-- Teacher authentication: same book list and file mapping as Editor, without the token field. -->
    <div class="auth-gate-overlay" id="login-shield-gate">
        <div class="auth-card">
            <h2>Teacher Verification</h2>
            <p>Select the vocabulary book, then enter your system password to access the Test Generator.</p>
            <div class="password-input-wrapper">
                <select class="custom-select-menu" id="login-book-selector" aria-label="Select book">
                    <option value="book_a" selected>Book A - 500 Arabic Word (Arabic to English)</option>
                    <option value="book_b">Book B - Lughat Al-Quran (Arabic to Urdu)</option>
                    <option value="book_c" disabled>Book C - Quran Tajweed (Coming later)</option>
                <option value="book_d">Book D - Quran Vocabulary (Arabic to English)</option>
                </select>
                <input type="password" class="admin-text-field" id="admin-passcode-box" placeholder="Enter System Password" autocomplete="current-password">
                <div class="auth-error" id="login-error" role="status" aria-live="polite"></div>
                <button id="verify-open-btn" type="button" data-action="evaluateTeacherCredentials">Verify &amp; Open Test Generator</button>
            </div>
        </div>
    </div>

    <div class="generator-wrapper">
        <h1>Quran Arabic Quiz - Test Generator</h1>
        <div class="status-banner" id="status-message">Please sign in to load vocabulary records.</div>
        <div class="words-selection-grid" id="tiles-matrix-box"></div>
        <div class="bottom-control-dashboard">
            <div class="counter-status-text" id="selection-counter-banner">Please select exactly 20 words (20 remaining)</div>
            <div class="output-code-container">
                <button id="generate-code-btn" data-action="processSelectedHexadecimalQuizCode" disabled>Generate Quiz Code</button>
                <input type="text" class="hex-output-field" id="quiz-code-output" placeholder="[ Quiz Code Output ]" readonly>
                <button id="copy-code-btn" data-action="copyGeneratedCodeToClipboard" style="background-color: rgba(255,255,255,0.08); color:#ffffff; border:1px solid rgba(255,255,255,0.15);" disabled>Copy Code</button>
            </div>
            <div class="pagination-bar-wrapper">
                <button id="prev-page-btn" style="padding: 8px 12px;" data-action="changeMatrixActivePage" data-value="-1" disabled>◀</button>
                <span class="page-indicator-text" id="page-number-text">Page 1 of 1</span>
                <button id="next-page-btn" style="padding: 8px 12px;" data-action="changeMatrixActivePage" data-value="1" disabled>▶</button>
            </div>
        </div>
    </div>

    <div class="toast-popup" id="toast-alert">Notification Popup</div>
