<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Arabic Quiz - Test Generator</title>
    <style>
        :root {
            --primary-gray: #2d3748;
            --button-gold: #d49a3b;
            --button-gold-hover: #e5ab4f;
            --button-gold-active: #b5802e;
            --exit-btn-color: rgba(255, 255, 255, 0.12);
            --exit-btn-hover: rgba(255, 255, 255, 0.2);
            --counter-gray: #a0aec0;
            --white: #ffffff;
            --gold-glow: 0 0 15px rgba(212, 154, 59, 0.6);
            --disabled-gray: rgba(255, 255, 255, 0.1);
            --disabled-text: rgba(255, 255, 255, 0.25);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a202c 100%);
            color: var(--white);
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .generator-wrapper {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: var(--button-gold);
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .status-banner {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            color: #cbd5e0;
            margin-bottom: 10px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            font-weight: 500;
            transition: opacity 0.5s ease;
        }

        .words-selection-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            flex: 1;
            min-height: 0;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 1200px) or (max-height: 750px) {
            .words-selection-grid { grid-template-columns: repeat(8, 1fr); }
        }

        .compact-word-tile {
            background: #ffffff;
            border-radius: 8px;
            padding: 8px;
            color: #1a202c;
            border: 2px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            text-align: center;
            justify-content: space-between;
            min-height: 0;
        }

        .compact-word-tile:hover { transform: translateY(-1px); border-color: #cbd5e0; }
        .compact-word-tile.selected-state { border-color: var(--button-gold); background: #fdfbf7; }
        .tile-header-index { font-size: 10px; font-weight: 800; color: #718096; text-align: left; }
        .tile-arabic-text {
            font-size: 24px;
            font-family: 'Traditional Arabic', 'Amiri', Georgia, serif;
            font-weight: bold;
            color: #2d3748;
            margin: 2px 0;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tile-meaning-text {
            font-size: 11px;
            font-weight: 700;
            color: #4a5568;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-top: 2px;
            border-top: 1px dashed #edf2f7;
        }
        .tile-checkbox-anchor {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 14px;
            height: 14px;
            border: 2px solid #cbd5e0;
            border-radius: 3px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .compact-word-tile.selected-state .tile-checkbox-anchor { background-color: var(--button-gold); border-color: var(--button-gold); }
        .compact-word-tile.selected-state .tile-checkbox-anchor::after {
            content: "✓";
            color: #1a1002;
            font-size: 11px;
            font-weight: bold;
        }

        .bottom-control-dashboard {
            background: rgba(45, 55, 72, 0.95);
            border: 2px solid var(--button-gold);
            padding: 15px;
            border-radius: 12px;
            box-shadow: var(--gold-glow), 0 -4px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-sizing: border-box;
            width: 100%;
        }
        .counter-status-text { font-size: 16px; font-weight: bold; color: var(--white); text-align: left; min-width: 280px; }
        .counter-status-text span { color: var(--button-gold); }
        .output-code-container { display: flex; gap: 10px; flex: 1; max-width: 600px; }
        .hex-output-field {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 10px;
            color: var(--button-gold);
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            text-align: center;
        }
        .pagination-bar-wrapper { display: flex; align-items: center; gap: 10px; }
        .page-indicator-text { font-size: 13px; font-weight: 600; color: var(--counter-gray); white-space: nowrap; }
        button {
            background-color: var(--button-gold);
            color: #1a1002;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        button:hover:not(:disabled) { background-color: var(--button-gold-hover); }
        button:disabled { background-color: var(--disabled-gray); color: var(--disabled-text); cursor: not-allowed; }
        .toast-popup {
            position: fixed;
            bottom: 100px;
            background: var(--button-gold);
            color: #1a1002;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 2500;
        }
        .toast-popup.show { opacity: 1; }

        /* Teacher verification uses the same dark-gray and gold palette as the generator. */
        .auth-gate-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a202c 100%);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.3s ease;
            overflow-y: auto;
        }
        .auth-card {
            background: rgba(45, 55, 72, 0.98);
            border: 2px solid var(--button-gold);
            border-radius: 12px;
            padding: 34px 28px;
            max-width: 440px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            box-shadow: var(--gold-glow), 0 10px 25px rgba(0,0,0,0.3);
            color: var(--white);
        }
        .auth-card h2 { margin: 0 0 10px; font-size: 22px; color: var(--button-gold); }
        .auth-card p { color: #cbd5e0; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
        .password-input-wrapper { display: flex; flex-direction: column; gap: 13px; width: 100%; }
        .admin-text-field {
            display: block;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 13px 14px;
            color: var(--white);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .admin-text-field::placeholder { color: #a0aec0; }
        .admin-text-field:focus { border-color: var(--button-gold); }
        .custom-select-menu {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--white);
            font-size: 15px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }
        .custom-select-menu:focus { border-color: var(--button-gold); }
        .custom-select-menu option { color: #1a202c; background: #ffffff; }
        .custom-select-menu option:disabled { color: #718096; background: #e2e8f0; }
        #verify-open-btn { display: block; width: 100%; box-sizing: border-box; }
        .auth-error { min-height: 18px; color: #feb2b2; font-size: 13px; text-align: left; }
        .is-hidden { display: none !important; }
        @media (max-width: 700px) {
            .bottom-control-dashboard { gap: 8px; flex-wrap: wrap; }
            .counter-status-text { min-width: 0; width: 100%; text-align: center; }
            .output-code-container { max-width: none; width: 100%; }
            .pagination-bar-wrapper { margin: 0 auto; }
        }
    </style>
</head>
<body>
    <!-- Teacher authentication: same book list and file mapping as Editor, without the token field. -->
    <div class="auth-gate-overlay" id="login-shield-gate">
        <div class="auth-card">
            <h2>Teacher Verification</h2>
            <p>Select the vocabulary book, then enter your system password to access the Test Generator.</p>
            <div class="password-input-wrapper">
                <select class="custom-select-menu" id="login-book-selector" aria-label="Select book">
                    <option value="book_a" selected>Book A - Arabic to English</option>
                    <option value="book_b" disabled>Book B - Arabic to Urdu (Disabled)</option>
                    <option value="book_c" disabled>Book C - Tajweed (Disabled)</option>
                </select>
                <input type="password" class="admin-text-field" id="admin-passcode-box" placeholder="Enter System Password" autocomplete="current-password">
                <div class="auth-error" id="login-error" role="status" aria-live="polite"></div>
                <button id="verify-open-btn" type="button" onclick="evaluateTeacherCredentials()">Verify &amp; Open Test Generator</button>
            </div>
        </div>
    </div>

    <div class="generator-wrapper">
        <h1>Quran Arabic Quiz - Test Generator</h1>
        <div class="status-banner" id="status-message">Please sign in to load vocabulary records.</div>
        <div class="words-selection-grid" id="tiles-matrix-box"></div>
        <div class="bottom-control-dashboard">
            <div class="counter-status-text" id="selection-counter-banner">Please select exactly 10 words (10 remaining)</div>
            <div class="output-code-container">
                <button id="generate-code-btn" onclick="processSelectedHexadecimalQuizCode()" disabled>Generate Quiz Code</button>
                <input type="text" class="hex-output-field" id="quiz-code-output" placeholder="[ Quiz Code Output ]" readonly>
                <button id="copy-code-btn" onclick="copyGeneratedCodeToClipboard()" style="background-color: rgba(255,255,255,0.08); color:#ffffff; border:1px solid rgba(255,255,255,0.15);" disabled>Copy Code</button>
            </div>
            <div class="pagination-bar-wrapper">
                <button id="prev-page-btn" style="padding: 8px 12px;" onclick="changeMatrixActivePage(-1)" disabled>◀</button>
                <span class="page-indicator-text" id="page-number-text">Page 1 of 1</span>
                <button id="next-page-btn" style="padding: 8px 12px;" onclick="changeMatrixActivePage(1)" disabled>▶</button>
            </div>
        </div>
    </div>

    <div class="toast-popup" id="toast-alert">Notification Popup</div>
    <script>
        let fullVocabularyInventory = [];
        let userSelectedAbsoluteIndices = [];
        let activeMatrixPage = 1;
        let totalCardsPerPageLimit = 50;

        // Keep the exact book IDs and filenames used by Editor.
        const BOOK_FILES = {
            book_a: "Vocabulary-File.txt",
            book_b: "Vocabulary-Urdu-File.txt",
            book_c: "Vocabulary-Tajweed-File.txt"
        };
        let activeBook = "book_a";
        let activeFile = BOOK_FILES.book_a;

        window.onload = function() {
            if (window.innerWidth <= 1200) totalCardsPerPageLimit = 40;
            document.getElementById('admin-passcode-box').addEventListener('keydown', function(event) {
                if (event.key === 'Enter') evaluateTeacherCredentials();
            });
            document.getElementById('admin-passcode-box').focus();
        };

        async function evaluateTeacherCredentials() {
            const passwordBox = document.getElementById('admin-passcode-box');
            const selectedBook = document.getElementById('login-book-selector').value;
            const plaintextPassword = passwordBox.value.trim();
            const errorBox = document.getElementById('login-error');
            const verifyButton = document.getElementById('verify-open-btn');
            errorBox.textContent = '';

            if (!selectedBook || !BOOK_FILES[selectedBook]) {
                errorBox.textContent = 'Please select a valid book.';
                return;
            }
            if (!plaintextPassword) {
                errorBox.textContent = 'Please enter the system password.';
                passwordBox.focus();
                return;
            }

            verifyButton.disabled = true;
            verifyButton.textContent = 'Verifying…';
            try {
                // CP.txt contains one Base64-encoded allowed password per line, as in the Editor's CP list.
                const response = await fetch('CP.txt?nocache=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error('Could not read CP.txt (' + response.status + ').');
                const cpText = await response.text();
                const allowedEncodedPasswords = cpText.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                const encodedInput = btoa(unescape(encodeURIComponent(plaintextPassword)));

                if (!allowedEncodedPasswords.includes(encodedInput)) {
                    errorBox.textContent = 'Invalid password. Access denied.';
                    passwordBox.value = '';
                    passwordBox.focus();
                    return;
                }

                activeBook = selectedBook;
                activeFile = BOOK_FILES[activeBook];
                const gate = document.getElementById('login-shield-gate');
                gate.style.opacity = '0';
                setTimeout(() => { gate.classList.add('is-hidden'); }, 300);
                loadSelectedVocabularyFile();
            } catch (error) {
                console.error(error);
                errorBox.textContent = 'Unable to verify password. Check that CP.txt is available beside this HTML file.';
            } finally {
                verifyButton.disabled = false;
                verifyButton.textContent = 'Verify & Open Test Generator';
            }
        }

        function loadSelectedVocabularyFile() {
            const banner = document.getElementById('status-message');
            banner.style.opacity = '1';
            banner.classList.remove('is-hidden');
            banner.textContent = 'Connecting to Vocabulary Records...';
            fetch(activeFile + '?nocache=' + Date.now(), { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('File collection failure (' + response.status + ').');
                    return response.text();
                })
                .then(text => processIncomingTextData(text))
                .catch(error => {
                    console.error(error);
                    banner.textContent = '⚠️ Failed to read ' + activeFile + '. Check that the file exists beside this HTML file.';
                    const gate = document.getElementById('login-shield-gate');
                    gate.classList.remove('is-hidden');
                    gate.style.opacity = '1';
                    document.getElementById('login-error').textContent = 'Vocabulary file could not be loaded. Please try again.';
                });
        }

        function processIncomingTextData(text) {
            const lines = text.split(/\r?\n/);
            fullVocabularyInventory = [];
            lines.forEach(line => {
                if (!line || !line.trim() || !line.includes('=')) return;
                const separatorIndex = line.indexOf('=');
                const word = line.slice(0, separatorIndex).trim();
                const meaning = line.slice(separatorIndex + 1).trim();
                if (word && meaning) fullVocabularyInventory.push({ word, meaning });
            });

            if (fullVocabularyInventory.length === 0) {
                document.getElementById('status-message').textContent = '⚠️ No matching vocabulary format found.';
            } else {
                const bannerNode = document.getElementById('status-message');
                bannerNode.textContent = '✅ Success: Parsed ' + fullVocabularyInventory.length + ' library records.';
                setTimeout(() => {
                    bannerNode.style.opacity = '0';
                    setTimeout(() => { bannerNode.classList.add('is-hidden'); }, 500);
                }, 2500);
                renderInventoryTilesGrid();
            }
        }

        function renderInventoryTilesGrid() {
            const gridBox = document.getElementById('tiles-matrix-box');
            gridBox.innerHTML = '';
            const totalRequiredPages = Math.ceil(fullVocabularyInventory.length / totalCardsPerPageLimit) || 1;
            if (activeMatrixPage < 1) activeMatrixPage = 1;
            if (activeMatrixPage > totalRequiredPages) activeMatrixPage = totalRequiredPages;
            const startIdx = (activeMatrixPage - 1) * totalCardsPerPageLimit;
            const endIdx = Math.min(startIdx + totalCardsPerPageLimit, fullVocabularyInventory.length);

            for (let i = startIdx; i < endIdx; i++) {
                const item = fullVocabularyInventory[i];
                const absoluteIndex = i + 1;
                const isSelected = userSelectedAbsoluteIndices.includes(absoluteIndex);
                const tile = document.createElement('div');
                tile.className = 'compact-word-tile' + (isSelected ? ' selected-state' : '');
                tile.onclick = function() { toggleWordSelection(absoluteIndex); };
                const indexNode = document.createElement('div');
                indexNode.className = 'tile-header-index';
                indexNode.textContent = '#' + String(absoluteIndex).padStart(3, '0');
                const checkboxNode = document.createElement('div');
                checkboxNode.className = 'tile-checkbox-anchor';
                const arabicNode = document.createElement('div');
                arabicNode.className = 'tile-arabic-text';
                arabicNode.textContent = item.word;
                const meaningNode = document.createElement('div');
                meaningNode.className = 'tile-meaning-text';
                meaningNode.title = item.meaning;
                meaningNode.textContent = item.meaning;
                tile.append(indexNode, checkboxNode, arabicNode, meaningNode);
                gridBox.appendChild(tile);
            }
            document.getElementById('page-number-text').textContent = 'Page ' + activeMatrixPage + ' of ' + totalRequiredPages;
            document.getElementById('prev-page-btn').disabled = (activeMatrixPage === 1);
            document.getElementById('next-page-btn').disabled = (activeMatrixPage === totalRequiredPages);
            updateStickyCounterBanner();
        }

        function changeMatrixActivePage(offset) {
            activeMatrixPage += offset;
            renderInventoryTilesGrid();
        }

        function toggleWordSelection(absoluteIndex) {
            const indexLocation = userSelectedAbsoluteIndices.indexOf(absoluteIndex);
            if (indexLocation > -1) {
                userSelectedAbsoluteIndices.splice(indexLocation, 1);
                resetOutputCodeState();
            } else {
                if (userSelectedAbsoluteIndices.length >= 10) {
                    launchToastAlert('⚠️ Selection filled! You have already picked 10 questions.');
                    return;
                }
                userSelectedAbsoluteIndices.push(absoluteIndex);
                resetOutputCodeState();
            }
            renderInventoryTilesGrid();
        }

        function updateStickyCounterBanner() {
            const banner = document.getElementById('selection-counter-banner');
            const totalPicked = userSelectedAbsoluteIndices.length;
            const generateBtn = document.getElementById('generate-code-btn');
            if (totalPicked < 10) {
                const requiredRemaining = 10 - totalPicked;
                banner.innerHTML = 'Please select exactly 10 words (<span>' + requiredRemaining + '</span> remaining)';
                generateBtn.disabled = true;
            } else {
                banner.innerHTML = '✅ 10 questions selected successfully!';
                generateBtn.disabled = false;
            }
        }

        function resetOutputCodeState() {
            document.getElementById('quiz-code-output').value = '';
            document.getElementById('copy-code-btn').disabled = true;
        }

        function processSelectedHexadecimalQuizCode() {
            if (userSelectedAbsoluteIndices.length !== 10) return;
            const sortedIndices = [...userSelectedAbsoluteIndices].sort((a, b) => a - b);
            let paddedNumericStringSequence = '';
            sortedIndices.forEach(idx => { paddedNumericStringSequence += String(idx).padStart(3, '0'); });
            try {
                const largeNumericRepresentation = BigInt(paddedNumericStringSequence);
                const computedHexadecimalCipherString = largeNumericRepresentation.toString(16).toUpperCase();
                document.getElementById('quiz-code-output').value = computedHexadecimalCipherString;
                document.getElementById('copy-code-btn').disabled = false;
                launchToastAlert('🎉 Quiz code compiled successfully!');
            } catch (error) {
                console.error(error);
                launchToastAlert('⚠️ Cipher generation failure.');
            }
        }

        function copyGeneratedCodeToClipboard() {
            const outputField = document.getElementById('quiz-code-output');
            if (!outputField.value) return;
            navigator.clipboard.writeText(outputField.value)
                .then(() => launchToastAlert('📋 Code copied to clipboard!'))
                .catch(err => {
                    console.error(err);
                    launchToastAlert('⚠️ Clipboard permissions blocked.');
                });
        }

        function launchToastAlert(message) {
            const toast = document.getElementById('toast-alert');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
