<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Arabic Quiz - Test Generator</title>
    <style>
        /* Base Theme Elements */
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #2d2d2d;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h1, h2 {
            color: #ffffff;
            text-align: center;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #b0b0b0;
        }

        select, input[type="password"] {
            width: 100%;
            padding: 12px;
            background-color: #3d3d3d;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }

        select:focus, input[type="password"]:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* Screen Visibility Controllers */
        #login-screen {
            display: block;
        }

        #generator-screen {
            display: none;
        }

        /* Test Generator App UI Specifics */
        .word-counter {
            text-align: center;
            font-size: 1.1em;
            margin: 15px 0;
            color: #4a90e2;
        }

        /* Notification Popup styling */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: #fff;
            padding: 15px 25px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
            border-left: 4px solid #ff4a4a;
        }
        .notification.success {
            border-left-color: #4aff4a;
        }
    </style>
</head>
<body>

    <!-- SECTION 1: VERIFICATION SCREEN (BOOK SELECTOR & PASSWORD ONLY) -->
    <div id="login-screen" class="container">
        <h2>Admin Verification</h2>
        <p style="text-align: center; color: #aaa; font-size: 0.9em; margin-bottom: 20px;">
            Select the vocabulary book and enter your password to access the test generator.
        </p>
        
        <div class="form-group">
            <label for="book-selector">Select Vocabulary Book</label>
            <select id="book-selector">
                <option value="book_a">Book A - Arabic to English</option>
                <option value="book_b" disabled>Book B - Arabic to Urdu (Disabled)</option>
                <option value="book_c" disabled>Book C - Tajweed (Disabled)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="system-password">System Password</label>
            <input type="password" id="system-password" placeholder="Enter password...">
        </div>

        <button id="verify-btn" class="btn" onclick="handleVerification()">Verify & Open Generator</button>
    </div>


    <!-- SECTION 2: TEST GENERATOR DEFAULT SCREEN -->
    <div id="generator-screen" class="container">
        <h1>Quran Arabic Quiz</h1>
        <h3 style="text-align: center; margin-top:0; color: #888;">Test Generator</h3>
        
        <div class="word-counter" id="status-message">
            Connecting to Vocabulary Records...
        </div>

        <div class="form-group" style="text-align: center; margin: 30px 0;">
            <p id="selection-prompt" style="color: #b0b0b0;">Please select exactly 10 words (10 remaining)</p>
            <!-- Your core database dictionary loop or checklist UI rendering goes here -->
        </div>

        <div style="display: flex; gap: 10px;">
            <button class="btn" id="generate-code-btn" disabled onclick="generateQuizCode()">Generate Quiz Code</button>
            <button class="btn" style="background-color: #444;" onclick="copyQuizCode()">Copy Code</button>
        </div>

        <div style="text-align: center; margin-top: 25px; color: #666; font-size: 0.9em;">
            ◀ Page 1 of 1 ▶
        </div>
    </div>

    <!-- NOTIFICATION POPUP -->
    <div id="notification-popup" class="notification">Notification Popup</div>


    <!-- APP JAVASCRIPT LOGIC -->
    <script>
        // Global State matching Editor-Beta storage requirements
        const AppConfig = {
            selectedBook: 'book_a',
            isAuthenticated: false
        };

        // UI Notification Helper
        function showNotification(message, isSuccess = false) {
            const popup = document.getElementById('notification-popup');
            popup.innerText = message;
            if(isSuccess) {
                popup.classList.add('success');
            } else {
                popup.classList.remove('success');
            }
            popup.style.display = 'block';
            setTimeout(() => { popup.style.display = 'none'; }, 3000);
        }

        // Authentication & Book Selection Logic
        async function handleVerification() {
            const passwordInput = document.getElementById('system-password').value;
            const selectedBook = document.getElementById('book-selector').value;
            const verifyBtn = document.getElementById('verify-btn');

            if (!passwordInput) {
                showNotification("Please enter your system password.");
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerText = "Verifying...";

            try {
                // Fetch the list of Base64 encoded passwords from CP.TXT
                const response = await fetch('CP.TXT');
                if (!response.ok) {
                    throw new Error("Could not access password database configuration file (CP.TXT).");
                }
                
                const textData = await response.text();
                // Clean lines and isolate encoded keys
                const validHashes = textData.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                
                // Process input to standard Base64 string match
                const encodedInput = btoa(passwordInput);

                if (validHashes.includes(encodedInput)) {
                    // 1. Save chosen book value to state and Storage mimicking Editor-Beta
                    AppConfig.selectedBook = selectedBook;
                    localStorage.setItem('quran_quiz_active_book', selectedBook);

                    // 2. Clear password input security track
                    document.getElementById('system-password').value = '';

                    // 3. Transition display screens smoothly 
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('generator-screen').style.display = 'block';
                    
                    showNotification("Verification successful!", true);
                    
                    // Initialize system core loop
                    initializeTestGenerator();
                } else {
                    showNotification("Invalid System Password. Access Denied.");
                    verifyBtn.disabled = false;
                    verifyBtn.innerText = "Verify & Open Generator";
                }

            } catch (error) {
                showNotification(error.message || "An error occurred during verification.");
                verifyBtn.disabled = false;
                verifyBtn.innerText = "Verify & Open Generator";
            }
        }

        // Placeholder Core functions for Test Generator System 
        function initializeTestGenerator() {
            // Emulating connection update using the saved book config context
            const statusMsg = document.getElementById('status-message');
            statusMsg.innerText = `Connected to [${AppConfig.selectedBook.toUpperCase()}] Database Successfully.`;
            statusMsg.style.color = "#4aff4a";
            
            // Your custom parsing loop for words array payload runs here...
        }

        function generateQuizCode() {
            showNotification("Quiz Code generated successfully!", true);
        }

        function copyQuizCode() {
            showNotification("Quiz Code copied to clipboard!", true);
        }

        // Allow 'Enter' key submission inside the password layout field
        document.getElementById('system-password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleVerification();
            }
        });
    </script>
</body>
</html>
