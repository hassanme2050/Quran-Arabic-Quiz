<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Arabic Quiz - Test Generator</title>
    <!-- Library required to screenshot only the targeted scorecard component -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-light-gray: #f7fafc;
            --panel-gray: #ffffff;
            --border-gray: #e2e8f0;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --input-focus-blue: #4299e1;
            --disabled-gray: #edf2f7;

            --primary-gray: #2d3748;
            --button-gold: #d49a3b;
            --button-gold-hover: #e5ab4f;
            --button-gold-active: #b5802e;
            --exit-btn-color: rgba(255, 255, 255, 0.12);
            --exit-btn-hover: rgba(255, 255, 255, 0.2);
            --counter-gray: #a0aec0;
            --white: #ffffff;
            --gold-glow: 0 0 15px rgba(212, 154, 59, 0.6);
            --disabled-text: rgba(255, 255, 255, 0.25);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a202c 100%);
            color: var(--white);
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Strictly prevents page scroll */
        }

        .generator-wrapper {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: var(--button-gold);
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .status-banner {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            color: #cbd5e0;
            margin-bottom: 10px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            font-weight: 500;
            transition: opacity 0.5s ease;
        }
        /* Authentication overlay matching specification layout profile */
        .auth-gate-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #edf2f7;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.3s ease;
            overflow-y: auto;
        }

        .auth-card {
            background: #ffffff;
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            padding: 34px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        .auth-card h2 {
            margin: 0 0 10px;
            font-size: 22px;
            color: var(--text-dark);
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 22px;
        }

        .password-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .admin-text-field {
            width: 100%;
            min-width: 0;
            background: #ffffff;
            border: 2px solid var(--border-gray);
            border-radius: 8px;
            padding: 13px 14px;
            color: var(--text-dark);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .admin-text-field:focus { border-color: var(--input-focus-blue); }

        .custom-select-menu {
            width: 100%;
            background: #ffffff;
            border: 2px solid var(--border-gray);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text-dark);
            font-size: 15px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .custom-select-menu:focus { border-color: var(--input-focus-blue); }
        .custom-select-menu option:disabled { color: var(--text-muted); background: #f7fafc; }

        /* Flexible content matrix box optimized to lock cards on a single screen framework */
        .words-selection-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* Default 10 columns */
            grid-template-rows: repeat(5, 1fr);    /* Default 5 rows */
            gap: 10px;
            flex: 1;
            min-height: 0; /* Critical override allows inner elements to shrink smoothly */
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Responsive adaptation parameters for tighter aspect displays */
        @media (max-width: 1200px) or (max-height: 750px) {
            .words-selection-grid {
                grid-template-columns: repeat(8, 1fr); /* Drops to 8 columns safely */
            }
        }

        .compact-word-tile {
            background: #ffffff;
            border-radius: 8px;
            padding: 8px;
            color: #1a202c;
            border: 2px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            text-align: center;
            justify-content: space-between;
            min-height: 0; /* Essential parameter protecting container structure limits */
        }

        .compact-word-tile:hover {
            transform: translateY(-1px);
            border-color: #cbd5e0;
        }

        .compact-word-tile.selected-state {
            border-color: var(--button-gold);
            background: #fdfbf7;
        }

        .tile-header-index {
            font-size: 10px;
            font-weight: 800;
            color: #718096;
            text-align: left;
        }

        .tile-arabic-text {
            font-size: 24px;
            font-family: 'Traditional Arabic', 'Amiri', Georgia, serif;
            font-weight: bold;
            color: #2d3748;
            margin: 2px 0;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tile-meaning-text {
            font-size: 11px;
            font-weight: 700;
            color: #4a5568;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-top: 2px;
            border-top: 1px dashed #edf2f7;
        }

        .tile-checkbox-anchor {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 14px;
            height: 14px;
            border: 2px solid #cbd5e0;
            border-radius: 3px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .compact-word-tile.selected-state .tile-checkbox-anchor {
            background-color: var(--button-gold);
            border-color: var(--button-gold);
        }

        .compact-word-tile.selected-state .tile-checkbox-anchor::after {
            content: "✓";
            color: #1a1002;
            font-size: 11px;
            font-weight: bold;
        }
        /* Control desk frame repositioned directly on the bottom edge */
        .bottom-control-dashboard {
            background: rgba(45, 55, 72, 0.95);
            border: 2px solid var(--button-gold);
            padding: 15px;
            border-radius: 12px;
            box-shadow: var(--gold-glow), 0 -4px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-sizing: border-box;
            width: 100%;
        }

        .counter-status-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--white);
            text-align: left;
            min-width: 280px;
        }

        .counter-status-text span {
            color: var(--button-gold);
        }

        .output-code-container {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 600px;
        }

        .hex-output-field {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 10px;
            color: var(--button-gold);
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            text-align: center;
        }

        .pagination-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-indicator-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--counter-gray);
            white-space: nowrap;
        }

        button {
            background-color: var(--button-gold);
            color: #1a1002;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            background-color: var(--button-gold-hover);
        }

        button:active:not(:disabled) {
            background-color: var(--button-gold-active);
        }

        button:disabled {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--disabled-text);
            cursor: not-allowed;
        }

        .toast-popup {
            position: fixed;
            bottom: 100px;
            background: var(--button-gold);
            color: #1a1002;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 2500;
        }
        .toast-popup.show { opacity: 1; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Fullscreen Security Shield Gate Verification Card Wrapper -->
    <div class="auth-gate-overlay" id="login-shield-gate">
        <div class="auth-card">
            <h2>Verification Required-BALUGAIN</h2>
            <p>Select the target vocabulary book, then enter your access password to launch the test generator workspace.</p>

            <div class="password-input-wrapper">
                <select class="custom-select-menu" id="login-book-selector" aria-label="Select book">
                    <option value="book_a" selected>Book A - Arabic to English</option>
                    <option value="book_b">Book B - Arabic to Urdu</option>
                    <option value="book_c">Book C - Tajweed</option>
                </select>
                <input type="password" class="admin-text-field" id="admin-passcode-box" placeholder="Enter System Password" autocomplete="current-password">
                <button id="verify-open-btn" onclick="evaluateAdministrativeCredentials()">Verify &amp; Open Generator</button>
            </div>
        </div>
    </div>

    <!-- Main Generator Studio Workbench Interface Panel Frame Container -->
    <div class="generator-wrapper">
        <h1>Quran Arabic Quiz - Test Generator</h1>
        
        <div class="status-banner" id="status-message">Connecting to Vocabulary Records...</div>

        <!-- Word Selection Grid Matrix Desk Viewport Component -->
        <div class="words-selection-grid" id="tiles-matrix-box"></div>

        <!-- Lower Dashboard Action Deck Hub -->
        <div class="bottom-control-dashboard">
            <div class="counter-status-text" id="selection-counter-banner">
                Please select exactly 10 words (10 remaining)
            </div>
            
            <div class="output-code-container">
                <button id="generate-code-btn" onclick="processSelectedHexadecimalQuizCode()" disabled>Generate Quiz Code</button>
                <input type="text" class="hex-output-field" id="quiz-code-output" placeholder="[ Quiz Code Output ]" readonly>
                <button id="copy-code-btn" onclick="copyGeneratedCodeToClipboard()" style="background-color: rgba(255,255,255,0.08); color:#ffffff; border:1px solid rgba(255,255,255,0.15);" disabled>Copy Code</button>
            </div>

            <!-- Grid Pagination Control Node Cluster -->
            <div class="pagination-bar-wrapper">
                <button id="prev-page-btn" style="padding: 8px 12px;" onclick="changeMatrixActivePage(-1)" disabled>◀</button>
                <span class="page-indicator-text" id="page-number-text">Page 1 of 1</span>
                <button id="next-page-btn" style="padding: 8px 12px;" onclick="changeMatrixActivePage(1)" disabled>▶</button>
            </div>
        </div>
    </div>

    <div class="toast-popup" id="toast-alert">Notification Popup</div>
    <script>
        // Mapping book files to their local file paths matching Editor profiles
        const BOOK_FILES = {
            book_a: "Vocabulary-File.txt",
            book_b: "Vocabulary-Urdu-File.txt",
            book_c: "Vocabulary-Tajweed-File.txt"
        };

        let fullVocabularyInventory = []; 
        let userSelectedAbsoluteIndices = []; 
        
        let activeMatrixPage = 1;
        let totalCardsPerPageLimit = 50; // Dynamic baseline layout constraint
        let activeFile = BOOK_FILES.book_a;

        window.onload = function() {
            // Evaluates real-time width constraints to shift page limits from 50 to 40 dynamically
            if (window.innerWidth <= 1200) {
                totalCardsPerPageLimit = 40;
            }
            
            // Allow pressing Enter key inside the passcode box to log in quickly
            document.getElementById('admin-passcode-box').addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    evaluateAdministrativeCredentials();
                }
            });
        };

        function evaluateAdministrativeCredentials() {
            const passwordBox = document.getElementById('admin-passcode-box');
            const selectedBook = document.getElementById('login-book-selector').value;
            const plaintextPassword = passwordBox.value.trim();

            if (!selectedBook || !BOOK_FILES[selectedBook]) {
                launchToastAlert("⚠️ Please select a valid book.");
                return;
            }

            if (!plaintextPassword) {
                launchToastAlert("⚠️ Password field is required.");
                return;
            }

            const clientGeneratedBase64 = btoa(plaintextPassword);

            // Asynchronously fetch cp.txt from the same local folder directory path
            fetch('cp.txt?nocache=' + Date.now(), { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('Password verification file connection issue.');
                    return response.text();
                })
                .then(text => {
                    // Split file context lines cleanly and filter out extra carriage whitespace
                    const validPayloadOptions = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);

                    if (!validPayloadOptions.includes(clientGeneratedBase64)) {
                        launchToastAlert("❌ Invalid administrative password access denied.");
                        passwordBox.value = '';
                        passwordBox.focus();
                        return;
                    }

                    // Authenticated successfully: assign active targets
                    activeFile = BOOK_FILES[selectedBook];

                    const gate = document.getElementById('login-shield-gate');
                    gate.style.opacity = '0';
                    setTimeout(() => gate.classList.add('hidden'), 300);

                    // Pull current dictionary records stream
                    initializeVocabularyDataStream();
                })
                .catch(error => {
                    console.error(error);
                    launchToastAlert("⚠️ System Error: Unable to access secure verification components.");
                });
        }
        function initializeVocabularyDataStream() {
            document.getElementById('status-message').textContent = 'Connecting to Vocabulary Records...';
            document.getElementById('status-message').style.opacity = '1';
            document.getElementById('status-message').classList.remove('hidden');

            fetch(activeFile + '?nocache=' + Date.now(), { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('File collection failure.');
                    return response.text();
                })
                .then(text => { processIncomingTextData(text); })
                .catch(error => {
                    console.error(error);
                    document.getElementById('status-message').textContent = '⚠️ Failed to read target dictionary: ' + activeFile;
                    
                    // Bounce user out to authentication card container loop on structural download errors
                    const gate = document.getElementById('login-shield-gate');
                    gate.classList.remove('hidden');
                    gate.style.opacity = '1';
                });
        }

        function processIncomingTextData(text) {
            const lines = text.split(/\r?\n/);
            fullVocabularyInventory = [];
            userSelectedAbsoluteIndices = []; // Clear current selections when swapping target files
            resetOutputCodeState();
            activeMatrixPage = 1;
            
            lines.forEach(line => {
                if (!line || !line.trim() || !line.includes('=')) return;
                
                const separatorIndex = line.indexOf('=');
                const word = line.slice(0, separatorIndex).trim();
                const meaning = line.slice(separatorIndex + 1).trim();
                if (word && meaning) {
                    fullVocabularyInventory.push({ word: word, meaning: meaning });
                }
            });

            if (fullVocabularyInventory.length === 0) {
                document.getElementById('status-message').textContent = '⚠️ No matching vocabulary format found.';
            } else {
                const bannerNode = document.getElementById('status-message');
                bannerNode.textContent = '✅ Success: Parsed ' + fullVocabularyInventory.length + ' library records.';
                
                // Triggers brief timed fade out matching style parameters
                setTimeout(() => {
                    bannerNode.style.opacity = '0';
                    // Completely clear space after animation fades
                    setTimeout(() => { bannerNode.classList.add('hidden'); }, 500);
                }, 2500);

                renderInventoryTilesGrid();
            }
        }

        function renderInventoryTilesGrid() {
            const gridBox = document.getElementById('tiles-matrix-box');
            gridBox.innerHTML = '';

            const totalRequiredPages = Math.ceil(fullVocabularyInventory.length / totalCardsPerPageLimit) || 1;
            
            if (activeMatrixPage < 1) activeMatrixPage = 1;
            if (activeMatrixPage > totalRequiredPages) activeMatrixPage = totalRequiredPages;

            const startIdx = (activeMatrixPage - 1) * totalCardsPerPageLimit;
            const endIdx = Math.min(startIdx + totalCardsPerPageLimit, fullVocabularyInventory.length);

            for (let i = startIdx; i < endIdx; i++) {
                const item = fullVocabularyInventory[i];
                const absoluteIndex = i + 1; 
                const isSelected = userSelectedAbsoluteIndices.includes(absoluteIndex);

                const tile = document.createElement('div');
                tile.className = 'compact-word-tile' + (isSelected ? ' selected-state' : '');
                tile.onclick = function() { toggleWordSelection(absoluteIndex); };

                tile.innerHTML = 
                    '<div class="tile-header-index">#' + String(absoluteIndex).padStart(3, '0') + '</div>' +
                    '<div class="tile-checkbox-anchor"></div>' +
                    '<div class="tile-arabic-text">' + item.word + '</div>' +
                    '<div class="tile-meaning-text" title="' + item.meaning + '">' + item.meaning + '</div>';

                gridBox.appendChild(tile);
            }

            document.getElementById('page-number-text').textContent = 'Page ' + activeMatrixPage + ' of ' + totalRequiredPages;
            document.getElementById('prev-page-btn').disabled = (activeMatrixPage === 1);
            document.getElementById('next-page-btn').disabled = (activeMatrixPage === totalRequiredPages);

            updateStickyCounterBanner();
        }

        function changeMatrixActivePage(offset) {
            activeMatrixPage += offset;
            renderInventoryTilesGrid();
        }

        function toggleWordSelection(absoluteIndex) {
            const indexLocation = userSelectedAbsoluteIndices.indexOf(absoluteIndex);

            if (indexLocation > -1) {
                userSelectedAbsoluteIndices.splice(indexLocation, 1);
                resetOutputCodeState();
            } else {
                if (userSelectedAbsoluteIndices.length >= 10) {
                    launchToastAlert("⚠️ Selection filled! You have already picked 10 questions.");
                    return;
                }
                userSelectedAbsoluteIndices.push(absoluteIndex);
                resetOutputCodeState();
            }

            renderInventoryTilesGrid();
        }

        function updateStickyCounterBanner() {
            const banner = document.getElementById('selection-counter-banner');
            const totalPicked = userSelectedAbsoluteIndices.length;
            const generateBtn = document.getElementById('generate-code-btn');

            if (totalPicked < 10) {
                const requiredRemaining = 10 - totalPicked;
                banner.innerHTML = 'Please select exactly 10 words (<span>' + requiredRemaining + '</span> remaining)';
                generateBtn.disabled = true;
            } else {
                banner.innerHTML = '✅ 10 questions selected successfully!';
                generateBtn.disabled = false;
            }
        }

        function resetOutputCodeState() {
            document.getElementById('quiz-code-output').value = '';
            document.getElementById('copy-code-btn').disabled = true;
        }

        function processSelectedHexadecimalQuizCode() {
            if (userSelectedAbsoluteIndices.length !== 10) return;

            let sortedIndices = [...userSelectedAbsoluteIndices].sort((a, b) => a - b);
            let paddedNumericStringSequence = '';
            
            sortedIndices.forEach(idx => {
                paddedNumericStringSequence += String(idx).padStart(3, '0');
            });

            try {
                let largeNumericRepresentation = BigInt(paddedNumericStringSequence);
                let computedHexadecimalCipherString = largeNumericRepresentation.toString(16).toUpperCase();

                document.getElementById('quiz-code-output').value = computedHexadecimalCipherString;
                document.getElementById('copy-code-btn').disabled = false;
                launchToastAlert("🎉 Quiz code compiled successfully!");
            } catch (error) {
                console.error(error);
                launchToastAlert("⚠️ Cipher generation failure.");
            }
        }

        function copyGeneratedCodeToClipboard() {
            const outputField = document.getElementById('quiz-code-output');
            if (!outputField.value) return;

            navigator.clipboard.writeText(outputField.value)
                .then(() => {
                    launchToastAlert("📋 Code copied to clipboard!");
                })
                .catch(err => {
                    console.error(err);
                    launchToastAlert("⚠️ Clipboard permissions blocked.");
                });
        }

        function launchToastAlert(message) {
            const toast = document.getElementById('toast-alert');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(launchToastAlert.timeoutId);
            launchToastAlert.timeoutId = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }
    </script>
</body>
</html>
