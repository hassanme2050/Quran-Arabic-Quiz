name: Transfer built Pineapple APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-transfer.yml']

permissions:
  actions: read
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QuranAQ-v1024.26-Pineapple-Android
          run-id: '40143337739'
          github-token: ${{ github.token }}
          path: apk
      - name: Transfer APK through connector-readable build output
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const bytes = fs.readFileSync('apk/QuranAQ-v1024.26-Pineapple.apk');
          const base64 = bytes.toString('base64');
          console.log('APK_SHA256=' + crypto.createHash('sha256').update(bytes).digest('hex'));
          console.log('APK_BYTES=' + bytes.length);
          for(let start=0; start<base64.length; start+=60000) {
            console.log('APK_BASE64_' + String(start/60000).padStart(4,'0') + '=' + base64.slice(start,start+60000));
          }
          console.log('APK_TRANSFER_COMPLETE');
          NODE
