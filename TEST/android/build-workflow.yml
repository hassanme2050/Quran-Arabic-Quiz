name: Build Pineapple Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-pineapple.yml'
      - 'TEST/android/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare offline app assets
        run: |
          node TEST/android/prepare-assets.cjs TEST
          ASSETS=TEST/android/app/src/main/assets/www
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/alexandria/Alexandria%5Bwght%5D.ttf' -o "$ASSETS/fonts/Alexandria.ttf"
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/alexandria/OFL.txt' -o "$ASSETS/licenses/Alexandria-OFL.txt"
          curl -fL --retry 3 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js' -o "$ASSETS/vendor/html2canvas.min.js"
          curl -fL --retry 3 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/LICENSE' -o "$ASSETS/licenses/html2canvas-LICENSE.txt"
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and lint APK
        run: gradle -p TEST/android assembleDebug lintDebug --no-daemon
      - name: Verify and name installable APK
        run: |
          mkdir -p android-output
          cp TEST/android/app/build/outputs/apk/debug/app-debug.apk 'android-output/QuranAQ-v1024.26-Pineapple.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose 'android-output/QuranAQ-v1024.26-Pineapple.apk'
          cd android-output
          sha256sum QuranAQ-v1024.26-Pineapple.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: QuranAQ-v1024.26-Pineapple-Android
          path: android-output/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: TEST/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
