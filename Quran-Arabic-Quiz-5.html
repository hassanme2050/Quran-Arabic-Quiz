<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Flashcards & Quiz</title>
    <!-- Library required to screenshot only the targeted scorecard component -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary-teal: #0c4d4d;
            --button-gold: #d49a3b;
            --button-gold-hover: #b5802e;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-gold: #f4be5e;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #073636 0%, #0d5454 50%, #083c3c 100%);
            color: var(--white);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--text-gold);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .status-banner {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #b3dfdf;
            margin-bottom: 25px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }

        .menu-buttons, .quiz-options, .navigation-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            background-color: var(--button-gold);
            color: #211502;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--button-gold-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        /* Secondary utility buttons */
        button.secondary-btn {
            background-color: rgba(255, 255, 255, 0.12);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button.secondary-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .card-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 30px;
            margin: 25px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1e2d2d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .counter-text {
            font-size: 14px;
            color: #a2cbcb;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .arabic-display {
            font-size: 56px;
            font-family: 'Traditional Arabic', 'Amiri', Georgia, serif;
            font-weight: bold;
            margin: 15px 0;
            color: #0c4d4d;
        }

        .meaning-display {
            font-size: 26px;
            font-weight: 500;
            color: #2c3e50;
            margin-top: 10px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 15px;
            width: 100%;
        }

        /* Quiz answer choices layout */
        .quiz-options button {
            background-color: rgba(255, 255, 255, 0.95);
            color: #1e2d2d;
            text-align: center;
            border: 1px solid #cbd5e1;
        }

        .quiz-options button:hover {
            background-color: #ffffff;
            box-shadow: 0 4px 12px rgba(255,255,255,0.15);
        }

        .quiz-options button.correct-choice {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #10b981 !important;
        }

        .quiz-options button.wrong-choice {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }

        /* Target area wrapper for screenshot captures */
        #screenshot-target-card {
            background: #ffffff;
            color: #073636;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .circle-score-box {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #0d5454;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            border: 4px solid var(--text-gold);
        }

        .circle-score-val {
            font-size: 32px;
            font-weight: bold;
        }

        .circle-percent-val {
            font-size: 15px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #ffffff;
            color: #1e2d2d;
            border-radius: 8px;
            overflow: hidden;
            font-size: 14px;
        }

        .summary-table th, .summary-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        .summary-table th {
            background-color: #f1f5f9;
            color: #0f172a;
            font-weight: bold;
        }

        .summary-arabic-text {
            font-size: 20px;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-weight: bold;
            color: #0d5454;
        }

        .badge-right { color: #10b981; font-weight: bold; }
        .badge-wrong { color: #ef4444; font-weight: bold; }

        .hidden { display: none !important; }
        
        .toast-popup {
            position: fixed;
            bottom: 30px;
            background: rgba(212, 154, 59, 0.95);
            color: #1e2d2d;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .toast-popup.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="app-title">Arabic Flashcards</h1>
        
        <!-- Status Message Banner View (Keeps clean count string) -->
        <div class="status-banner" id="status-message">Connecting to Vocabulary Records...</div>

        <!-- Mode Selection Menu View -->
        <div id="menu-view" class="hidden">
            <div class="menu-buttons">
                <button onclick="startSession('all', 'flashcard')">Review All (10 Random Words)</button>
                <button onclick="startSession('last', 'flashcard')">Review Last 10 Words</button>
                <button onclick="startSession('all', 'quiz')">Quiz Mode: All (10 Random)</button>
                <button onclick="startSession('last', 'quiz')">Quiz Mode: Last 10 Words</button>
            </div>
        </div>

        <!-- Flashcard Review Mode View -->
        <div id="flashcard-view" class="hidden">
            <div class="counter-text" id="card-counter"></div>
            <div class="card-box" onclick="toggleFlashcardMeaning()">
                <div class="arabic-display" id="card-arabic-field">-</div>
                <div class="meaning-display hidden" id="card-meaning-field">-</div>
            </div>
            <div class="navigation-buttons">
                <button id="card-action-btn" onclick="handleCardProgression()">Show Meaning</button>
                <button class="secondary-btn" onclick="exitToHome()">← Exit to Menu</button>
            </div>
        </div>

        <!-- Quiz Mode View -->
        <div id="quiz-view" class="hidden">
            <div class="counter-text" id="quiz-counter"></div>
            <div class="card-box" style="cursor: default; min-height: 140px; margin-bottom: 15px;">
                <div class="arabic-display" id="quiz-arabic-field">-</div>
            </div>
            <div class="quiz-options" id="quiz-options-box">
                <!-- Choices generated dynamically -->
            </div>
            <div class="navigation-buttons" style="margin-top: 20px;">
                <button class="secondary-btn" onclick="exitToHome()">← Exit to Menu</button>
            </div>
        </div>

        <!-- Quiz Performance Score Screen View (Only contains Score Elements for Screenshot) -->
        <div id="quiz-finished-view" class="hidden">
            <div id="screenshot-target-card">
                <h2 style="margin: 0 0 5px 0; color: #073636; font-size: 24px;">Quiz Complete!</h2>
    <script>
        let vocabularyList = [];
        let currentPool = [];
        let sessionWords = [];
        let currentIndex = 0;
        let isMeaningVisible = false;
        let currentMode = 'flashcard'; 
        let quizHistory = []; 

        window.onload = function() {
            fetch('Vocabulary-File.txt')
                .then(response => {
                    if (!response.ok) throw new Error('File read failure.');
                    return response.text();
                })
                .then(text => { parseVocabularyTextFile(text); })
                .catch(error => {
                    console.error(error);
                    document.getElementById('status-message').textContent = '⚠️ Failed to read Vocabulary-File.txt. Check folder files.';
                });
        };

        function parseVocabularyTextFile(text) {
            const lines = text.split('\n');
            vocabularyList = [];
            
            lines.forEach(line => {
                if (line.includes('=')) {
                    const parts = line.split('=');
                    const word = parts[0].trim();
                    const meaning = parts[1].trim();
                    if (word && meaning) {
                        vocabularyList.push({ word: word, meaning: meaning });
                    }
                }
            });

            if (vocabularyList.length === 0) {
                document.getElementById('status-message').textContent = '⚠️ Vocabulary-File.txt loaded but no rows matched "word = meaning".';
            } else {
                // Clear and display success banner matching your request exactly
                document.getElementById('status-message').textContent = '✅ Success: Loaded ' + vocabularyList.length + ' total words';
                switchView('menu-view');
            }
        }

        function generateQuizChoices(correctItem) {
            let choices = [correctItem];
            const correctMeaningsLower = getMeaningTokens(correctItem.meaning);

            // Filter out items with identical meanings or overlapping translations
            let validDistractors = vocabularyList.filter(item => {
                if (item.word === correctItem.word) return false;
                
                const itemMeaningsLower = getMeaningTokens(item.meaning);
                
                if (item.meaning.toLowerCase() === correctItem.meaning.toLowerCase()) return false;
                
                const hasOverlap = itemMeaningsLower.some(token => correctMeaningsLower.includes(token));
                return !hasOverlap;
            });

            if (validDistractors.length < 3) {
                validDistractors = vocabularyList.filter(item => item.word !== correctItem.word);
            }

            shuffleArray(validDistractors);

            for (let i = 0; i < validDistractors.length; i++) {
                if (choices.length >= 4) break;
                if (!choices.some(c => c.meaning.toLowerCase() === validDistractors[i].meaning.toLowerCase())) {
                    choices.push(validDistractors[i]);
                }
            }

            while (choices.length < 4) {
                choices.push({ word: '—', meaning: 'Alternative Choice Option ' + (choices.length + 1) });
            }

            shuffleArray(choices);
            return choices;
        }

        function getMeaningTokens(meaningString) {
            return meaningString.toLowerCase()
                .replace(/[!.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
                .split('/')
                .map(s => s.trim())
                .filter(s => s.length > 0);
        }
        function startSession(strategy, mode) {
            currentMode = mode;
            quizHistory = [];
            
            if (strategy === 'all') {
                currentPool = [...vocabularyList];
                sessionWords = getRandomSubset(currentPool, 10);
            } else if (strategy === 'last') {
                currentPool = vocabularyList.slice(-10);
                sessionWords = [...currentPool];
                shuffleArray(sessionWords);
            }

            currentIndex = 0;
            
            if (currentMode === 'flashcard') {
                document.getElementById('app-title').textContent = "Arabic Vocabulary Flashcards";
                switchView('flashcard-view');
                showCard();
            } else {
                document.getElementById('app-title').textContent = "Arabic Vocabulary Quiz";
                switchView('quiz-view');
                showQuizQuestion();
            }
        }

        /* --- Flashcard Mode View Actions --- */
        function showCard() {
            isMeaningVisible = false;
            document.getElementById('card-meaning-field').classList.add('hidden');
            document.getElementById('card-counter').textContent = "Word " + (currentIndex + 1) + " of " + sessionWords.length;
            document.getElementById('card-arabic-field').textContent = sessionWords[currentIndex].word;
            document.getElementById('card-meaning-field').textContent = sessionWords[currentIndex].meaning;
            document.getElementById('card-action-btn').textContent = "Show Meaning";
        }

        function toggleFlashcardMeaning() {
            isMeaningVisible = !isMeaningVisible;
            if (isMeaningVisible) {
                document.getElementById('card-meaning-field').classList.remove('hidden');
                document.getElementById('card-action-btn').textContent = "Next Word";
            } else {
                document.getElementById('card-meaning-field').classList.add('hidden');
                document.getElementById('card-action-btn').textContent = "Show Meaning";
            }
        }

        function handleCardProgression() {
            if (!isMeaningVisible) {
                toggleFlashcardMeaning();
            } else {
                currentIndex++;
                if (currentIndex < sessionWords.length) {
                    showCard();
                } else {
                    switchView('review-finished-view');
                }
            }
        }

        /* --- Quiz Mode View Actions --- */
        function showQuizQuestion() {
            const currentItem = sessionWords[currentIndex];
            document.getElementById('quiz-counter').textContent = "Question " + (currentIndex + 1) + " of " + sessionWords.length;
            document.getElementById('quiz-arabic-field').textContent = currentItem.word;

            const optionsBox = document.getElementById('quiz-options-box');
            optionsBox.innerHTML = '';

            const choices = generateQuizChoices(currentItem);
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.textContent = choice.meaning;
                btn.onclick = function() { evaluateQuizAnswer(btn, choice, currentItem); };
                optionsBox.appendChild(btn);
            });
        }

        function evaluateQuizAnswer(selectedButton, chosenChoice, correctItem) {
            const optionsBox = document.getElementById('quiz-options-box');
            const buttons = optionsBox.getElementsByTagName('button');
            
            for (let btn of buttons) {
                btn.disabled = true;
            }

            const isCorrect = (chosenChoice.meaning === correctItem.meaning);
            
            quizHistory.push({
                index: currentIndex + 1,
                word: correctItem.word,
                chosen: chosenChoice.meaning,
                correct: correctItem.meaning,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                selectedButton.classList.add('correct-choice');
            } else {
                selectedButton.classList.add('wrong-choice');
                for (let btn of buttons) {
                    if (btn.textContent === correctItem.meaning) {
                        btn.classList.add('correct-choice');
                    }
                }
            }

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < sessionWords.length) {
                    showQuizQuestion();
                } else {
                    displayQuizSummary();
                }
            }, 1200);
        }

        function displayQuizSummary() {
            const totalCorrect = quizHistory.filter(h => h.isCorrect).length;
            const percentage = Math.round((totalCorrect / sessionWords.length) * 100);
            
            document.getElementById('score-text-value').textContent = totalCorrect + "/" + sessionWords.length;
            document.getElementById('percent-text-value').textContent = percentage + "%";

            // Hide the table initially per instructions
            const tableContainer = document.getElementById('summary-table-container');
            tableContainer.classList.add('hidden');
            document.getElementById('toggle-table-btn').textContent = "📊 Show Performance Summary";

            let tableHtml = '<table class="summary-table"><thead><tr>' +
                '<th>#</th><th>Word</th><th>Your Choice</th><th>Correct Meaning</th><th>Result</th>' +
                '</tr></thead><tbody>';

            quizHistory.forEach(item => {
                const badge = item.isCorrect ? '<span class="badge-right">Right</span>' : '<span class="badge-wrong">Wrong</span>';
                tableHtml += '<tr>' +
                    '<td>' + item.index + '</td>' +
                    '<td class="summary-arabic-text"><b>' + item.word + '</b></td>' +
                    '<td>' + item.chosen + '</td>' +
                    '<td><b>' + item.correct + '</b></td>' +
                    '<td>' + badge + '</td>' +
                    '</tr>';
            });

            tableHtml += '</tbody></table>';
            tableContainer.innerHTML = tableHtml;
            switchView('quiz-finished-view');
        }

        function toggleSummaryTableVisibility() {
            const tableContainer = document.getElementById('summary-table-container');
            const toggleBtn = document.getElementById('toggle-table-btn');
            
            if (tableContainer.classList.contains('hidden')) {
                tableContainer.classList.remove('hidden');
                toggleBtn.textContent = "📊 Hide Performance Summary";
            } else {
                tableContainer.classList.add('hidden');
                toggleBtn.textContent = "📊 Show Performance Summary";
            }
        }

        /* --- Canvas Capture Mechanism Fix --- */
        function copyScreenshotToClipboard() {
            const target = document.getElementById('screenshot-target-card');
            
            html2canvas(target, {
                scale: 2,
                backgroundColor: "#ffffff",
                logging: false,
                useCORS: true
            }).then(canvas => {
                canvas.toBlob(blob => {
                    if (!blob) {
                        launchToastAlert("⚠️ Rendering image profile failed.");
                        return;
                    }
                    
                    try {
                        navigator.clipboard.write([
                            new ClipboardItem({ [blob.type]: blob })
                        ]).then(() => {
                            launchToastAlert("📸 Scorecard copied! Paste (Ctrl+V) it anywhere.");
                        }).catch(err => {
                            console.error(err);
                            fallbackDownloadMechanism(canvas);
                        });
                    } catch (clipboardError) {
                        console.error(clipboardError);
                        fallbackDownloadMechanism(canvas);
                    }
                }, 'image/png');
            });
        }

        function fallbackDownloadMechanism(canvas) {
            const dataUrl = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.download = 'Quiz_Score_Summary.png';
            link.href = dataUrl;
            link.click();
            launchToastAlert("📥 Clipboard restricted. Scorecard saved as download!");
        }

        /* --- General System Utilities --- */
        function getRandomSubset(arr, size) {
            let shuffled = [...arr];
            shuffleArray(shuffled);
            return shuffled.slice(0, size);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function switchView(viewId) {
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('flashcard-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('quiz-finished-view').classList.add('hidden');
            document.getElementById('review-finished-view').classList.add('hidden');

            document.getElementById(viewId).classList.remove('hidden');
        }

        function exitToHome() {
            document.getElementById('app-title').textContent = "Arabic Flashcards";
            switchView('menu-view');
        }

        function launchToastAlert(message) {
            const toast = document.getElementById('toast-alert');
            toast.textContent = message;
			toast.classList.add('show');
			setTimeout(() => {
			toast.classList.remove('show');
		}, 3500);
	}
