name: Verify Strawberry Test2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Test2/**', '.github/workflows/verify-strawberry-test2.yml']
concurrency:
  group: strawberry-test2-verification
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Quest and Peaches regression checks
        run: node --test Test2/tests/quest.test.mjs Test2/tests/flows.test.mjs Test2/tests/lughat.test.mjs Test2/tests/dictionary-search.test.mjs Test2/tests/editor-book.test.mjs Test2/tests/quiz-attempt.test.mjs Test2/tests/tajweed.test.mjs Test2/tests/book-d.test.mjs
      - name: Install browser runtime
        run: |
          npm install --prefix Test2 --no-save --package-lock=false playwright@1.56.1
          Test2/node_modules/.bin/playwright install --with-deps chromium
      - name: Book D Review and verse details desktop/mobile and live API checks
        run: node Test2/tests/book-d.browser.mjs
      - name: Named and timed quiz-code screenshot and clipboard checks
        run: node Test2/tests/quiz-code.browser.mjs
      - name: Tajweed Student and Editor desktop and mobile checks
        run: node Test2/tests/tajweed.browser.mjs
      - name: Editor login desktop and mobile browser checks
        run: node Test2/tests/editor.browser.mjs
      - name: Quest desktop and mobile browser checks
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/Test2/node_modules/playwright
          QUEST_QA_DIR: ${{ runner.temp }}/strawberry-qa
        run: node Test2/tests/quest.browser.mjs
      - name: Peaches desktop and mobile browser checks
        run: node Test2/tests/peaches.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Strawberry-Test2-browser-screenshots
          path: |
            ${{ runner.temp }}/strawberry-qa/
            artifacts/
          if-no-files-found: ignore
      - name: Preview map screenshots through connector
        if: always()
        env:
          QUEST_QA_DIR: ${{ runner.temp }}/strawberry-qa
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          for(const name of ['desktop-map.jpg','mobile-map.jpg','desktop-book-b.jpg','mobile-book-b.jpg','failure.jpg']) {
            const file=path.join(process.env.QUEST_QA_DIR,name);
            if(!fs.existsSync(file))continue;
            const base64=fs.readFileSync(file).toString('base64');
            for(let start=0;start<base64.length;start+=48000) console.log('QUEST_IMAGE|'+name+'|'+String(start/48000).padStart(4,'0')+'|'+base64.slice(start,start+48000));
          }
          for(const name of ['editor-open-1280.png','editor-open-390.png','editor-book-b-1280.png','editor-book-b-390.png','editor-harakat-restored-1280.png','editor-harakat-restored-390.png','editor-failure.png','coded-quiz-timer-390.png','coded-quiz-result-390.png','scorecard-clipboard-390.png','coded-quiz-failure.png','tajweed-quiz-390.png','tajweed-editor-390.png','tajweed-failure.png','book-d-card-390.png','book-d-details-390.png','book-d-live-390.png','book-d-quest-details-390.png','book-d-failure.png']) {
            const file=path.join('artifacts',name);
            if(!fs.existsSync(file))continue;
            const base64=fs.readFileSync(file).toString('base64');
            for(let start=0;start<base64.length;start+=48000) console.log('EDITOR_IMAGE|'+name+'|'+String(start/48000).padStart(4,'0')+'|'+base64.slice(start,start+48000));
          }
          NODE
