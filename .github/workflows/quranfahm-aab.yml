name: QuranFahm signed AAB
on:
  push:
    branches: [main]
    paths: ['.github/workflows/quranfahm-aab.yml']
permissions:
  contents: read
jobs:
  prepare-key:
    runs-on: ubuntu-latest
    outputs:
      public-key: \${{ steps.generate.outputs.public-key }}
      artifact-password: \${{ steps.generate.outputs.artifact-password }}
    steps:
      - uses: actions/checkout@v4
      - id: generate
        run: node .github/quranfahm-aab/exchange.cjs generate
      - uses: actions/upload-artifact@v4
        with:
          name: qf-aab-exchange-key
          path: qf-exchange/
          retention-days: 1
  bundle:
    needs: prepare-key
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QF_EXCHANGE_PASSWORD: \${{ needs.prepare-key.outputs.artifact-password }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qf-aab-exchange-key
          path: qf-exchange
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare approved X app and root library
        run: node .github/android-package-build/prepare-assets.cjs X dates
      - name: Recover same signing key and updated app icon
        run: node .github/quranfahm-aab/exchange.cjs prepare
      - name: Install build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build signed Android App Bundle
        run: gradle -p .github/android-package-build bundleDatesRelease --no-daemon
      - name: Verify AAB signature and app identity
        run: |
          AAB='.github/android-package-build/app/build/outputs/bundle/datesRelease/app-dates-release.aab'
          jarsigner -verify -strict "$AAB" >/tmp/qf-jarsigner.txt
          keytool -printcert -jarfile "$AAB" | tee /tmp/qf-cert.txt
          grep -qi 'SHA256: C2:3F:8D:3C:1A:69:BE:94:EF:FA:38:E0:5F:58:9F:57:C4:CB:8F:1F:01:65:52:3F:34:2C:61:78:EB:9A:3F:EA' /tmp/qf-cert.txt
          echo 'AAB signature verified against the working InstallFix APK upload certificate.'
      - name: Collect AAB
        run: node .github/quranfahm-aab/exchange.cjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: QuranFahm-AAB-v1107.26-InstallFix
          path: quranfahm-aab-output/
          retention-days: 7
      - name: Remove temporary signing exchange
        if: always()
        run: node .github/quranfahm-aab/exchange.cjs cleanup
