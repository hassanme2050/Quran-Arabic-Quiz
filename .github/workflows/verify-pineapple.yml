name: Verify Pineapple web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pineapple.yml'
      - 'index.html'
      - 'Editor.html'
      - 'Test-Generator.html'
      - 'Vocabulary-File.txt'
      - 'css/**'
      - 'js/**'
      - 'shared/**'
      - 'editor/**'
      - 'test-generator/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify quiz, dictionary, teacher tools and HTTP routes
        run: node --test tests/flows.test.mjs
