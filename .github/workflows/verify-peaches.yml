name: Verify Peaches preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Test/**'
      - '.github/workflows/verify-peaches.yml'
permissions:
  contents: read
concurrency:
  group: verify-peaches
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parser and app regressions
        run: node --test tests/flows.test.mjs tests/lughat.test.mjs
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser flows
        run: node tests/peaches.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Peaches-browser-screenshots
          path: Test/artifacts
