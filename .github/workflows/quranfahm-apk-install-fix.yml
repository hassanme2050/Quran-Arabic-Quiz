name: QuranFahm APK installation fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/quranfahm-apk-install-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare approved X app and root library
        run: node .github/android-package-build/prepare-assets.cjs X dates
      - name: Prepare separate QuranFahm identity and updated supplied icon
        run: node .github/quranfahm-apk-install-fix/release.cjs prepare
      - name: Preserve encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: QuranFahm-install-fix-encrypted-signing-backup
          path: |
            quranfahm-apk-fix-output/signing-backup.encrypted.json
            quranfahm-apk-fix-output/upload-certificate.pem
          retention-days: 7
      - name: Install build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build signed APK only and run lint
        run: gradle -p .github/android-package-build assembleDatesRelease lintDatesRelease --no-daemon
      - name: Verify APK signature and identity
        run: |
          APK='.github/android-package-build/app/build/outputs/apk/dates/release/app-dates-release.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 10
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation beside previous Dates and launch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/quranfahm-apk-install-fix/install-test.sh
      - name: Collect APK and transfer for local storage
        run: node .github/quranfahm-apk-install-fix/release.cjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: QuranFahm-APK-install-fix-v1107.26
          path: quranfahm-apk-fix-output/
          retention-days: 7
