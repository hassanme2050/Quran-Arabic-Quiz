plugins { id 'com.android.application' }
android {
    namespace 'com.hassanme2050.quranaq'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.hassanme2050.quranaq'
        minSdk 23
        targetSdk 36
        versionCode 103126
        versionName '1030.26'
    }
    flavorDimensions += 'version'
    productFlavors {
        strawberry { dimension 'version'; applicationIdSuffix '.strawberry'; versionNameSuffix '-Strawberry'; resValue 'string','app_name','QuranAQ Strawberry' }
        dates { dimension 'version'; applicationIdSuffix '.dates'; versionNameSuffix '-Dates'; resValue 'string','app_name','QuranAQ Dates' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
